# Databricks Unity Catalog metric view for SV_BILLING_REVENUE (generated by SemLift 1.0.0)
version: 0.1
source: energy_semantic.core.fct_billing
comment: Billed revenue
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: meter
  source: energy_semantic.core.dim_meter
  'on': source.METER_ID = meter.METER_ID
- name: customer
  source: energy_semantic.core.dim_customer
  'on': meter.CUSTOMER_ID = customer.CUSTOMER_ID
- name: location
  source: energy_semantic.core.dim_location
  'on': meter.LOCATION_ID = location.LOCATION_ID
dimensions:
- name: Due Date
  expr: DUE_DATE
- name: Is Ebill
  expr: IS_EBILL
- name: Is Overdue
  expr: IS_OVERDUE
- name: Payment Status
  expr: PAYMENT_STATUS
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
- name: Meter Id
  expr: meter.METER_ID
- name: Is Smart Meter
  expr: meter.IS_SMART_METER
- name: Customer Id
  expr: customer.CUSTOMER_ID
- name: Account Type
  expr: customer.ACCOUNT_TYPE
- name: Customer Name
  expr: customer.CUSTOMER_NAME
- name: Customer Segment
  expr: customer.CUSTOMER_SEGMENT
- name: Service Tier
  expr: customer.SERVICE_TIER
- name: City
  expr: location.CITY
- name: Region
  expr: location.REGION
measures:
- name: Total Bill Amount
  expr: SUM(BILL_AMOUNT)
- name: Total Demand Charge
  expr: SUM(DEMAND_CHARGE)
- name: Total Energy Charge
  expr: SUM(ENERGY_CHARGE)
- name: Total Tax Amount
  expr: SUM(TAX_AMOUNT)
- name: Total Bill With Tax Sum
  expr: SUM(TOTAL_BILL_WITH_TAX)
- name: Billing Count
  expr: COUNT(BILL_ID)
