# Databricks Unity Catalog metric view for SV_METER_CONSUMPTION (generated by SemanticLift 1.0.0)
version: 0.1
source: energy_semantic.core.fct_meter_reading
comment: Metered consumption
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: meter
  source: energy_semantic.core.dim_meter
  'on': source.METER_ID = meter.METER_ID
- name: tariff
  source: energy_semantic.core.dim_tariff
  'on': source.TARIFF_ID = tariff.TARIFF_ID
- name: customer
  source: energy_semantic.core.dim_customer
  'on': meter.CUSTOMER_ID = customer.CUSTOMER_ID
- name: location
  source: energy_semantic.core.dim_location
  'on': meter.LOCATION_ID = location.LOCATION_ID
dimensions:
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Is Weekend
  expr: dt.IS_WEEKEND
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
- name: Meter Id
  expr: meter.METER_ID
- name: Is Smart Meter
  expr: meter.IS_SMART_METER
- name: Meter Type
  expr: meter.METER_TYPE
- name: Tariff Type
  expr: tariff.TARIFF_TYPE
- name: Customer Id
  expr: customer.CUSTOMER_ID
- name: Account Type
  expr: customer.ACCOUNT_TYPE
- name: Customer Name
  expr: customer.CUSTOMER_NAME
- name: Customer Segment
  expr: customer.CUSTOMER_SEGMENT
- name: Service Tier
  expr: customer.SERVICE_TIER
- name: City
  expr: location.CITY
- name: Region
  expr: location.REGION
measures:
- name: Total Co2 Estimate Kg
  expr: SUM(CO2_ESTIMATE_KG)
- name: Total Consumption Kwh
  expr: SUM(CONSUMPTION_KWH)
- name: Total Consumption Mwh
  expr: SUM(CONSUMPTION_MWH)
- name: Total Off Peak Kwh
  expr: SUM(OFF_PEAK_KWH)
- name: Max Peak Demand Kw
  expr: MAX(PEAK_DEMAND_KW)
- name: Total Reactive Kvarh
  expr: SUM(REACTIVE_KVARH)
- name: Peak Off Peak Ratio
  expr: SUM(CONSUMPTION_KWH) / NULLIF(SUM(OFF_PEAK_KWH), 0)
- name: Meter Reading Count
  expr: COUNT(READING_ID)
- name: Avg Demand Charge Rate
  expr: AVG(tariff.DEMAND_CHARGE_RATE)
- name: Avg Rate Per Kwh
  expr: AVG(tariff.RATE_PER_KWH)
