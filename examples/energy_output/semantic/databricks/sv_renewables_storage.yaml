# Databricks Unity Catalog metric view for SV_RENEWABLES_STORAGE (generated by SemanticLift 1.0.0)
# Not reachable from rec_certificate (model as a separate metric view): storage_asset, storage_status
version: 0.1
source: energy_semantic.core.fct_rec_certificate
comment: REC certificates and storage status
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: energy_source
  source: energy_semantic.core.dim_energy_source
  'on': source.SOURCE_ID = energy_source.SOURCE_ID
- name: power_plant
  source: energy_semantic.core.dim_power_plant
  'on': source.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
dimensions:
- name: Status
  expr: STATUS
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Month Name
  expr: dt.MONTH_NAME
- name: Source Name
  expr: energy_source.SOURCE_NAME
- name: Plant Name
  expr: power_plant.PLANT_NAME
- name: Region
  expr: power_plant.REGION
measures:
- name: Rec Certificate Count
  expr: COUNT(REC_ID)
- name: Avg Co2 Factor Kg Kwh
  expr: AVG(energy_source.CO2_FACTOR_KG_KWH)
