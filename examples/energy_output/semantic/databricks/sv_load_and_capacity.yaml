# Databricks Unity Catalog metric view for SV_LOAD_AND_CAPACITY (generated by SemLift 1.0.0)
# Not reachable from load_forecast (model as a separate metric view): substation, substation_load, transmission_line, line_loading
version: 0.1
source: energy_semantic.core.fct_load_forecast
comment: Load forecast
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: location
  source: energy_semantic.core.dim_location
  'on': source.LOCATION_ID = location.LOCATION_ID
dimensions:
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Is Holiday
  expr: dt.IS_HOLIDAY
- name: Is Weekend
  expr: dt.IS_WEEKEND
- name: Month Name
  expr: dt.MONTH_NAME
- name: Month Number
  expr: dt.MONTH_NUMBER
- name: Quarter
  expr: dt.QUARTER
- name: Climate Zone
  expr: location.CLIMATE_ZONE
- name: Location Region
  expr: location.REGION
measures:
- name: Avg Actual Load Mw
  expr: AVG(ACTUAL_LOAD_MW)
- name: Avg Forecast Accuracy Pct
  expr: AVG(FORECAST_ACCURACY_PCT)
- name: Avg Forecasted Load Mw
  expr: AVG(FORECASTED_LOAD_MW)
- name: Max Peak Forecast Mw
  expr: MAX(PEAK_FORECAST_MW)
- name: Avg Variance Mw
  expr: AVG(VARIANCE_MW)
- name: Load Forecast Count
  expr: COUNT(LOAD_FORECAST_ID)
