# Databricks Unity Catalog metric view for SV_EV_CHARGING (generated by SemanticLift 1.0.0)
version: 0.1
source: energy_semantic.core.fct_ev_charging
comment: EV charging sessions
joins:
- name: charger
  source: energy_semantic.core.dim_charger
  'on': source.CHARGER_ID = charger.CHARGER_ID
- name: customer
  source: energy_semantic.core.dim_customer
  'on': source.CUSTOMER_ID = customer.CUSTOMER_ID
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
dimensions:
- name: Charger Id
  expr: charger.CHARGER_ID
- name: Customer Name
  expr: customer.CUSTOMER_NAME
- name: Customer Segment
  expr: customer.CUSTOMER_SEGMENT
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Is Weekend
  expr: dt.IS_WEEKEND
- name: Month Name
  expr: dt.MONTH_NAME
measures:
- name: Total Cost
  expr: SUM(COST)
- name: Total Energy Delivered Kwh
  expr: SUM(ENERGY_DELIVERED_KWH)
- name: Max Peak Kw
  expr: MAX(PEAK_KW)
- name: Ev Charging Count
  expr: COUNT(EV_CHARGING_ID)
