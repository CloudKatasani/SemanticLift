# Databricks Unity Catalog metric view for SV_CUSTOMER_SERVICE (generated by SemLift 1.0.0)
# Not reachable from service_request (model as a separate metric view): complaint, field_service, technician
version: 0.1
source: energy_semantic.core.fct_service_request
comment: Service requests
joins:
- name: agent
  source: energy_semantic.core.dim_agent
  'on': source.AGENT_ID = agent.AGENT_ID
- name: customer
  source: energy_semantic.core.dim_customer
  'on': source.CUSTOMER_ID = customer.CUSTOMER_ID
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
dimensions:
- name: Priority
  expr: PRIORITY
- name: Request Type
  expr: REQUEST_TYPE
- name: Resolution Date
  expr: RESOLUTION_DATE
- name: Status
  expr: STATUS
- name: Churn Risk
  expr: customer.CHURN_RISK
- name: Customer Name
  expr: customer.CUSTOMER_NAME
- name: Customer Segment
  expr: customer.CUSTOMER_SEGMENT
- name: Agent Id
  expr: agent.AGENT_ID
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
measures:
- name: Service Request Count
  expr: COUNT(SERVICE_REQUEST_ID)
- name: Total Lifetime Value Usd
  expr: SUM(customer.LIFETIME_VALUE_USD)
- name: Avg Nps Score
  expr: AVG(customer.NPS_SCORE)
