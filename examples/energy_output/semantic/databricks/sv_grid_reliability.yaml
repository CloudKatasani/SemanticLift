# Databricks Unity Catalog metric view for SV_GRID_RELIABILITY (generated by SemanticLift 1.0.0)
version: 0.1
source: energy_semantic.core.fct_outage_event
comment: Outage events and reliability indices
joins:
- name: outage_cause
  source: energy_semantic.core.dim_outage_cause
  'on': source.CAUSE_CODE = outage_cause.CAUSE_CODE
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: location
  source: energy_semantic.core.dim_location
  'on': source.LOCATION_ID = location.LOCATION_ID
dimensions:
- name: Outage Id
  expr: OUTAGE_ID
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Is Holiday
  expr: dt.IS_HOLIDAY
- name: Is Weekend
  expr: dt.IS_WEEKEND
- name: Month Name
  expr: dt.MONTH_NAME
- name: Month Number
  expr: dt.MONTH_NUMBER
- name: Quarter
  expr: dt.QUARTER
- name: Climate Zone
  expr: location.CLIMATE_ZONE
- name: Region
  expr: location.REGION
- name: Cause Code
  expr: outage_cause.CAUSE_CODE
- name: Cause Description
  expr: outage_cause.CAUSE_DESCRIPTION
measures:
- name: Total Customers Affected
  expr: SUM(CUSTOMERS_AFFECTED)
- name: Total Duration Minutes
  expr: SUM(DURATION_MINUTES)
- name: Total Maifi Count
  expr: SUM(MAIFI_COUNT)
- name: Total Saidi Minutes
  expr: SUM(SAIDI_MINUTES)
- name: Total Saifi Count
  expr: SUM(SAIFI_COUNT)
- name: Outage Event Count
  expr: COUNT(OUTAGE_ID)
