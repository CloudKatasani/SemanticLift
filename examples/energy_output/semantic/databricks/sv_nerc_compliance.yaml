# Databricks Unity Catalog metric view for SV_NERC_COMPLIANCE (generated by SemanticLift 1.0.0)
# Not reachable from compliance_event (model as a separate metric view): violation, audit_record, data_submission, misoperation, prc004_test, reporting_entity, asset
version: 0.1
source: energy_semantic.core.fct_compliance_event
comment: NERC/FERC compliance events
joins:
- name: nerc_standard
  source: energy_semantic.core.dim_nerc_standard
  'on': source.STANDARD_REF = nerc_standard.STANDARD_REF
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
dimensions:
- name: Event Type
  expr: EVENT_TYPE
- name: Requirement Ref
  expr: REQUIREMENT_REF
- name: Resolution Date
  expr: RESOLUTION_DATE
- name: Severity
  expr: SEVERITY
- name: Status
  expr: STATUS
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
- name: Standard Ref
  expr: nerc_standard.STANDARD_REF
measures:
- name: Compliance Event Count
  expr: COUNT(COMPLIANCE_EVENT_ID)
