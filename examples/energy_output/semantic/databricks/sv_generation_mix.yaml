# Databricks Unity Catalog metric view for SV_GENERATION_MIX (generated by SemLift 1.0.0)
version: 0.1
source: energy_semantic.core.fct_generation
comment: Generation output
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: power_plant
  source: energy_semantic.core.dim_power_plant
  'on': source.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
- name: energy_source
  source: energy_semantic.core.dim_energy_source
  'on': source.SOURCE_ID = energy_source.SOURCE_ID
dimensions:
- name: Plant Name
  expr: power_plant.PLANT_NAME
- name: Plant Type
  expr: power_plant.PLANT_TYPE
- name: Region
  expr: power_plant.REGION
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Full Date
  expr: dt.FULL_DATE
- name: Is Weekend
  expr: dt.IS_WEEKEND
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
- name: Is Rec Eligible
  expr: energy_source.IS_REC_ELIGIBLE
- name: Source Category
  expr: energy_source.SOURCE_CATEGORY
- name: Source Name
  expr: energy_source.SOURCE_NAME
measures:
- name: Total Co2 Emissions Kg
  expr: SUM(CO2_EMISSIONS_KG)
- name: Avg Capacity Factor Pct
  expr: AVG(CAPACITY_FACTOR_PCT)
- name: Max Capacity Mw
  expr: MAX(CAPACITY_MW)
- name: Avg Fuel Cost Per Mwh
  expr: AVG(FUEL_COST_PER_MWH)
- name: Total Generated Mwh
  expr: SUM(GENERATED_MWH)
- name: Co2 Intensity Kg Per Mwh
  expr: SUM(CO2_EMISSIONS_KG) / NULLIF(SUM(GENERATED_MWH), 0)
- name: Generation Count
  expr: COUNT(GENERATION_ID)
- name: Max Installed Capacity Mw
  expr: MAX(power_plant.INSTALLED_CAPACITY_MW)
- name: Avg Co2 Factor Kg Kwh
  expr: AVG(energy_source.CO2_FACTOR_KG_KWH)
