# Databricks Unity Catalog metric view for SV_MARKET_AND_FUEL (generated by SemLift 1.0.0)
# Not reachable from market_settlement (model as a separate metric view): fuel_cost
version: 0.1
source: energy_semantic.core.fct_market_settlement
comment: Market settlements and fuel cost
joins:
- name: counterparty
  source: energy_semantic.core.dim_counterparty
  'on': source.COUNTERPARTY_ID = counterparty.COUNTERPARTY_ID
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: gl_account
  source: energy_semantic.core.dim_gl_account
  'on': source.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
- name: cost_center
  source: energy_semantic.core.dim_cost_center
  'on': gl_account.COST_CENTER = cost_center.COST_CENTER
dimensions:
- name: Market Type
  expr: MARKET_TYPE
- name: Counterparty Id
  expr: counterparty.COUNTERPARTY_ID
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Month Name
  expr: dt.MONTH_NAME
- name: Quarter
  expr: dt.QUARTER
- name: Account Code
  expr: gl_account.ACCOUNT_CODE
- name: Account Name
  expr: gl_account.ACCOUNT_NAME
- name: Cost Center
  expr: cost_center.COST_CENTER
measures:
- name: Total Energy Mwh
  expr: SUM(ENERGY_MWH)
- name: Avg Price Mwh
  expr: AVG(PRICE_MWH)
- name: Total Settlement Amount
  expr: SUM(SETTLEMENT_AMOUNT)
- name: Market Settlement Count
  expr: COUNT(MARKET_SETTLEMENT_ID)
