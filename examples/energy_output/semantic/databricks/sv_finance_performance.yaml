# Databricks Unity Catalog metric view for SV_FINANCE_PERFORMANCE (generated by SemanticLift 1.0.0)
# Not reachable from budget_actual (model as a separate metric view): revenue, capex_project, capex_spend
version: 0.1
source: energy_semantic.core.fct_budget_actual
comment: Budget vs actual
joins:
- name: dt
  source: energy_semantic.core.dim_date
  'on': source.DATE_KEY = dt.DATE_KEY
- name: gl_account
  source: energy_semantic.core.dim_gl_account
  'on': source.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
- name: cost_center
  source: energy_semantic.core.dim_cost_center
  'on': gl_account.COST_CENTER = cost_center.COST_CENTER
dimensions:
- name: Account Code
  expr: gl_account.ACCOUNT_CODE
- name: Account Name
  expr: gl_account.ACCOUNT_NAME
- name: Fiscal Year
  expr: dt.FISCAL_YEAR
- name: Month Name
  expr: dt.MONTH_NAME
- name: Month Number
  expr: dt.MONTH_NUMBER
- name: Quarter
  expr: dt.QUARTER
- name: Cost Center
  expr: cost_center.COST_CENTER
measures:
- name: Total Actual Amount
  expr: SUM(ACTUAL_AMOUNT)
- name: Total Budget Amount
  expr: SUM(BUDGET_AMOUNT)
- name: Total Variance Amount
  expr: SUM(VARIANCE_AMOUNT)
- name: Avg Variance Pct
  expr: AVG(VARIANCE_PCT)
- name: Budget Actual Count
  expr: COUNT(BUDGET_ACTUAL_ID)
