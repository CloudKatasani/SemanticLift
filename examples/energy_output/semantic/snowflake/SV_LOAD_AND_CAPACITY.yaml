verified_queries:
- name: peak_load_analysis
  question: What is the peak load analysis by full date, month name, is holiday?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.IS_HOLIDAY AS is_holiday, location.REGION AS location_region, MAX(load_forecast.PEAK_FORECAST_MW) AS max_peak_forecast_mw, AVG(load_forecast.ACTUAL_LOAD_MW) AS avg_actual_load_mw, MAX(substation_load.PEAK_LOAD_MW) AS max_peak_load_mw
    FROM __load_forecast AS load_forecast
    JOIN __dt AS dt ON load_forecast.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON load_forecast.LOCATION_ID = location.LOCATION_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: transmission_constraint_report
  question: What is the transmission constraint report by full date, line name, voltage kv?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, transmission_line.LINE_NAME AS line_name, transmission_line.VOLTAGE_KV AS voltage_kv, transmission_line.CONSTRAINT_FLAG AS constraint_flag, location.REGION AS location_region, MAX(transmission_line.THERMAL_LIMIT_MW) AS max_thermal_limit_mw, AVG(line_loading.CURRENT_LOAD_MW) AS avg_current_load_mw
    FROM __transmission_line AS transmission_line
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: smart_grid_performance
  question: What is the smart grid performance by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, location.REGION AS location_region, AVG(load_forecast.FORECAST_ACCURACY_PCT) AS avg_forecast_accuracy_pct, AVG(substation_load.LOAD_FACTOR_PCT) AS avg_load_factor_pct
    FROM __load_forecast AS load_forecast
    JOIN __dt AS dt ON load_forecast.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON load_forecast.LOCATION_ID = location.LOCATION_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: protection_system_status
  question: What is the protection system status by full date, substation name, region?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, substation.SUBSTATION_NAME AS substation_name, substation.REGION AS region, transmission_line.LINE_NAME AS line_name, transmission_line.CONSTRAINT_FLAG AS constraint_flag, AVG(substation_load.LOAD_FACTOR_PCT) AS avg_load_factor_pct
    FROM __substation_load AS substation_load
    JOIN __dt AS dt ON substation_load.DATE_KEY = dt.DATE_KEY
    JOIN __substation AS substation ON substation_load.SUBSTATION_ID = substation.SUBSTATION_ID
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: unit_commitment_schedule
  question: What is the unit commitment schedule by full date, month name, location region?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, location.REGION AS location_region, substation.SUBSTATION_NAME AS substation_name, AVG(load_forecast.FORECASTED_LOAD_MW) AS avg_forecasted_load_mw, MAX(substation.CAPACITY_MVA) AS max_capacity_mva, MAX(substation_load.PEAK_LOAD_MW) AS max_peak_load_mw, AVG(substation_load.LOAD_FACTOR_PCT) AS avg_load_factor_pct
    FROM __load_forecast AS load_forecast
    JOIN __dt AS dt ON load_forecast.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON load_forecast.LOCATION_ID = location.LOCATION_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: ancillary_services_dispatch
  question: What is the ancillary services dispatch by full date, location region, substation name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, location.REGION AS location_region, substation.SUBSTATION_NAME AS substation_name, MAX(substation.CAPACITY_MVA) AS max_capacity_mva, MAX(substation_load.PEAK_LOAD_MW) AS max_peak_load_mw, AVG(load_forecast.FORECASTED_LOAD_MW) AS avg_forecasted_load_mw
    FROM __substation AS substation
    GROUP BY 1, 2, 3
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: frequency_deviation_report
  question: What is the frequency deviation report by full date, is weekend, substation name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.IS_WEEKEND AS is_weekend, substation.SUBSTATION_NAME AS substation_name, substation.REGION AS region, dt.MONTH_NUMBER AS month_number, AVG(load_forecast.VARIANCE_MW) AS avg_variance_mw
    FROM __load_forecast AS load_forecast
    JOIN __dt AS dt ON load_forecast.DATE_KEY = dt.DATE_KEY
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: weather_load_correlation
  question: What is the weather load correlation by full date, is weekend, is holiday?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.IS_WEEKEND AS is_weekend, dt.IS_HOLIDAY AS is_holiday, location.CLIMATE_ZONE AS climate_zone, location.REGION AS location_region, AVG(load_forecast.ACTUAL_LOAD_MW) AS avg_actual_load_mw, AVG(load_forecast.FORECAST_ACCURACY_PCT) AS avg_forecast_accuracy_pct
    FROM __load_forecast AS load_forecast
    JOIN __dt AS dt ON load_forecast.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON load_forecast.LOCATION_ID = location.LOCATION_ID
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
