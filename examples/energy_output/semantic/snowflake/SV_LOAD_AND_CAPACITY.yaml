  metrics:
  - name: max_capacity_mva
    expr: MAX(capacity_mva)
    description: MAX of capacity mva (semi-additive; default aggregation from rule ADD-03:Capacity)
    synonyms:
    - max capacity mva
    - capacity mva
- name: substation_load
