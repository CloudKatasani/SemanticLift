    data_type: VARCHAR
    description: Grain key of FCT_SUBSTATION_LOAD
  metrics:
  - name: avg_load_factor_pct
    expr: AVG(load_factor_pct)
    description: AVG of load factor pct (non-additive; default aggregation from rule ADD-02:Pct)
    synonyms:
    - avg load factor pct
