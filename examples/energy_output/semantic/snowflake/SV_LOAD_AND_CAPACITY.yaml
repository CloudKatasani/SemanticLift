name: SV_LOAD_AND_CAPACITY
description: Load forecast (generated by SemLift 1.0.0)
tables:
- name: load_forecast
  description: 'Fact at LoadForecast grain. Source: ENERGY_OPS_DW.LOAD_FORECAST. Origin: inferred from Energy_Operations_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_LOAD_FORECAST
  primary_key:
    columns:
    - LOAD_FORECAST_ID
  synonyms:
  - load forecast
  - load forecasts
  facts:
  - name: actual_load_mw
    expr: ACTUAL_LOAD_MW
    data_type: NUMBER
    description: 'Measure ''actual load mw''; default aggregation AVG (semi-additive). Origin: inferred from report usage
      (Energy_Operations_Package)'
    synonyms:
    - actual load mw
  - name: forecast_accuracy_pct
    expr: FORECAST_ACCURACY_PCT
    data_type: NUMBER
    description: 'Measure ''forecast accuracy pct''; default aggregation AVG (non-additive). Origin: inferred from report
      usage (Energy_Operations_Package)'
    synonyms:
    - forecast accuracy pct
  - name: forecasted_load_mw
    expr: FORECASTED_LOAD_MW
    data_type: NUMBER
    description: 'Measure ''forecasted load mw''; default aggregation AVG (semi-additive). Origin: inferred from report usage
      (Energy_Operations_Package)'
    synonyms:
    - forecasted load mw
  - name: peak_forecast_mw
    expr: PEAK_FORECAST_MW
    data_type: NUMBER
    description: 'Measure ''peak forecast mw''; default aggregation MAX (semi-additive). Origin: inferred from report usage
      (Energy_Operations_Package)'
    synonyms:
    - peak forecast mw
  - name: variance_mw
    expr: VARIANCE_MW
    data_type: NUMBER
    description: 'Measure ''variance mw''; default aggregation AVG (semi-additive). Origin: inferred from report usage (Energy_Operations_Package)'
    synonyms:
    - variance mw
  - name: load_forecast_id
    expr: LOAD_FORECAST_ID
    data_type: VARCHAR
    description: Grain key of FCT_LOAD_FORECAST
  metrics:
  - name: avg_actual_load_mw
    expr: AVG(actual_load_mw)
    description: AVG of actual load mw (semi-additive; default aggregation from rule ADD-04:MW)
    synonyms:
    - avg actual load mw
    - actual load mw
  - name: avg_forecast_accuracy_pct
    expr: AVG(forecast_accuracy_pct)
    description: AVG of forecast accuracy pct (non-additive; default aggregation from rule ADD-02:Pct)
    synonyms:
    - avg forecast accuracy pct
    - forecast accuracy pct
  - name: avg_forecasted_load_mw
    expr: AVG(forecasted_load_mw)
    description: AVG of forecasted load mw (semi-additive; default aggregation from rule ADD-04:MW)
    synonyms:
    - avg forecasted load mw
    - forecasted load mw
  - name: max_peak_forecast_mw
    expr: MAX(peak_forecast_mw)
    description: MAX of peak forecast mw (semi-additive; default aggregation from rule ADD-03:Peak)
    synonyms:
    - max peak forecast mw
    - peak forecast mw
  - name: avg_variance_mw
    expr: AVG(variance_mw)
    description: AVG of variance mw (semi-additive; default aggregation from rule ADD-04:MW)
    synonyms:
    - avg variance mw
    - variance mw
  - name: load_forecast_count
    expr: COUNT(load_forecast_id)
    description: Number of load forecast rows
    synonyms:
    - number of load forecasts
- name: substation
  description: 'Dimension for Substation (split from report usage, rule DIM-02). Source: RAW_ENERGY_OPS.SUBSTATION (TODO confirm)'
  base_table:
