verified_queries:
- name: prc004_requirement_2_audit_report
  question: What is the prc004 requirement 2 audit report by full date, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, prc004_test.REQUIREMENT_SECTION AS requirement_section, asset.ASSET_ID AS asset_id, prc004_test.TEST_RESULT AS test_result, AVG(prc004_test.MAINTENANCE_INTERVAL) AS avg_maintenance_interval
    FROM __prc004_test AS prc004_test
    JOIN __dt AS dt ON prc004_test.DATE_KEY = dt.DATE_KEY
    JOIN __asset AS asset ON prc004_test.ASSET_ID = asset.ASSET_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: protection_system_maintenance
  question: What is the protection system maintenance by full date, quarter, requirement section?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.QUARTER AS quarter, prc004_test.REQUIREMENT_SECTION AS requirement_section, asset.ASSET_ID AS asset_id, prc004_test.TEST_RESULT AS test_result, prc004_test.NEXT_TEST_DUE AS next_test_due, AVG(prc004_test.MAINTENANCE_INTERVAL) AS avg_maintenance_interval
    FROM __prc004_test AS prc004_test
    JOIN __dt AS dt ON prc004_test.DATE_KEY = dt.DATE_KEY
    JOIN __asset AS asset ON prc004_test.ASSET_ID = asset.ASSET_ID
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: annual_compliance_summary
  question: What is the annual compliance summary by full date, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, compliance_event.EVENT_TYPE AS event_type, compliance_event.SEVERITY AS severity, compliance_event.STATUS AS status, SUM(violation.PENALTY) AS total_penalty
    FROM __violation AS violation
    JOIN __dt AS dt ON violation.DATE_KEY = dt.DATE_KEY
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
