name: SV_METER_CONSUMPTION
description: Metered consumption (generated by SemLift 1.0.0)
tables:
- name: meter_reading
  description: 'Fact at MeterReading grain. Source: CC_AND_B_PROD.METER_READING. Origin: FM Business Layer.MeterReading'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_METER_READING
  primary_key:
    columns:
    - READING_ID
  synonyms:
  - meter reading
  - meter readings
  facts:
  - name: co2_estimate_kg
    expr: CO2_ESTIMATE_KG
    data_type: NUMBER
    description: Estimated CO2 emissions at 0.233 kg/kWh (US EPA average grid emission factor)
    synonyms:
    - co2 estimate kg
  - name: consumption_kwh
    expr: CONSUMPTION_KWH
    data_type: NUMBER
    description: 'Measure ''consumption kwh''; default aggregation SUM (additive). Origin: FM Business Layer.MeterReading.ConsumptionKWh'
    synonyms:
    - consumption kwh
  - name: consumption_mwh
    expr: CONSUMPTION_MWH
    data_type: NUMBER
    description: 'Measure ''consumption mwh''; default aggregation SUM (additive). Origin: FM Business Layer.MeterReading.ConsumptionMWh'
    synonyms:
    - consumption mwh
  - name: off_peak_kwh
    expr: OFF_PEAK_KWH
    data_type: NUMBER
    description: 'Measure ''off peak kwh''; default aggregation SUM (additive). Origin: FM Business Layer.MeterReading.OffPeakKWh'
    synonyms:
    - off peak kwh
  - name: peak_demand_kw
    expr: PEAK_DEMAND_KW
    data_type: NUMBER
    description: 'Measure ''peak demand kw''; default aggregation MAX (semi-additive). Origin: FM Business Layer.MeterReading.PeakDemandKW'
    synonyms:
    - peak demand kw
  - name: reactive_kvarh
    expr: REACTIVE_KVARH
    data_type: NUMBER
    description: 'Measure ''reactive kvarh''; default aggregation SUM (additive). Origin: FM Business Layer.MeterReading.ReactiveKVARh'
    synonyms:
    - reactive kvarh
  - name: reading_id
    expr: READING_ID
    data_type: VARCHAR
    description: Grain key of FCT_METER_READING
  metrics:
  - name: total_co2_estimate_kg
    expr: SUM(co2_estimate_kg)
    description: SUM of co2 estimate kg (additive; default aggregation from FM)
    synonyms:
    - total co2 estimate kg
    - co2 estimate kg
  - name: total_consumption_kwh
    expr: SUM(consumption_kwh)
    description: SUM of consumption kwh (additive; default aggregation from FM)
    synonyms:
    - total consumption kwh
    - consumption kwh
  - name: total_consumption_mwh
    expr: SUM(consumption_mwh)
    description: SUM of consumption mwh (additive; default aggregation from FM)
    synonyms:
    - total consumption mwh
    - consumption mwh
  - name: total_off_peak_kwh
    expr: SUM(off_peak_kwh)
    description: SUM of off peak kwh (additive; default aggregation from FM)
    synonyms:
    - total off peak kwh
    - off peak kwh
  - name: max_peak_demand_kw
    expr: MAX(peak_demand_kw)
    description: MAX of peak demand kw (semi-additive; default aggregation from FM)
    synonyms:
    - max peak demand kw
    - peak demand kw
  - name: total_reactive_kvarh
    expr: SUM(reactive_kvarh)
    description: SUM of reactive kvarh (additive; default aggregation from FM)
    synonyms:
    - total reactive kvarh
    - reactive kvarh
  - name: peak_off_peak_ratio
    expr: SUM(consumption_kwh) / NULLIF(SUM(off_peak_kwh), 0)
    description: Ratio metric from FM calculation MeterReading.PeakOffPeakRatio (regularAggregate=calculated)
    synonyms:
    - peak off peak ratio
  - name: meter_reading_count
    expr: COUNT(reading_id)
    description: Number of meter reading rows
    synonyms:
    - number of meter readings
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: is_weekend
    expr: IS_WEEKEND
    data_type: BOOLEAN
    description: 'Attribute ''is weekend''. Origin: FM Business Layer.Date.IsWeekend'
    synonyms:
    - is weekend
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
  time_dimensions:
  - name: full_date
    expr: FULL_DATE
    data_type: DATE
    description: 'Attribute ''full date''. Origin: FM Business Layer.Date.FullDate'
    synonyms:
    - full date
    - reading date
    - bill date
    - gen date
    - event date
    - request date
- name: meter
  description: 'Dimension at Meter grain. Source: CC_AND_B_PROD.METER. Origin: FM Business Layer.Meter'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_METER
  primary_key:
    columns:
    - METER_ID
  synonyms:
  - meter
  dimensions:
  - name: meter_id
    expr: METER_ID
    data_type: VARCHAR
    description: 'Identifier ''meter id''. Origin: FM Business Layer.Meter.MeterID'
    synonyms:
    - meter id
  - name: is_smart_meter
    expr: IS_SMART_METER
    data_type: BOOLEAN
    description: 'Attribute ''is smart meter''. Origin: FM Business Layer.Meter.IsSmartMeter'
    synonyms:
    - is smart meter
  - name: meter_type
    expr: METER_TYPE
    data_type: VARCHAR
    description: 'Attribute ''meter type''. Origin: FM Business Layer.Meter.MeterType'
    synonyms:
    - meter type
- name: tariff
  description: 'Dimension at Tariff grain. Source: CC_AND_B_PROD.TARIFF. Origin: FM Business Layer.Tariff'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_TARIFF
  primary_key:
    columns:
    - TARIFF_ID
  synonyms:
  - tariff
  dimensions:
  - name: tariff_type
    expr: TARIFF_TYPE
    data_type: VARCHAR
    description: 'Attribute ''tariff type''. Origin: FM Business Layer.Tariff.TariffType'
    synonyms:
    - tariff type
  facts:
  - name: demand_charge_rate
    expr: DEMAND_CHARGE_RATE
    data_type: NUMBER
    description: 'Measure ''demand charge rate''; default aggregation AVG (non-additive). Origin: FM Business Layer.Tariff.DemandChargeRate'
    synonyms:
    - demand charge rate
  - name: rate_per_kwh
    expr: RATE_PER_KWH
    data_type: NUMBER
    description: 'Measure ''rate per kwh''; default aggregation AVG (non-additive). Origin: FM Business Layer.Tariff.RatePerKWh'
    synonyms:
    - rate per kwh
  metrics:
  - name: avg_demand_charge_rate
    expr: AVG(demand_charge_rate)
    description: AVG of demand charge rate (non-additive; default aggregation from FM)
    synonyms:
    - avg demand charge rate
    - demand charge rate
  - name: avg_rate_per_kwh
    expr: AVG(rate_per_kwh)
    description: AVG of rate per kwh (non-additive; default aggregation from FM)
    synonyms:
    - avg rate per kwh
    - rate per kwh
- name: customer
  description: 'Dimension at Customer grain. Source: ENERGY_DW.CUSTOMER. Origin: FM Business Layer.Customer (conformed across
    Energy_Billing_Package, Energy_CustomerService_Package)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_CUSTOMER
  primary_key:
    columns:
    - CUSTOMER_ID
  synonyms:
  - customer
  dimensions:
  - name: customer_id
    expr: CUSTOMER_ID
    data_type: VARCHAR
    description: 'Identifier ''customer id''. Origin: FM Business Layer.Customer.CustomerID'
    synonyms:
    - customer id
  - name: account_type
    expr: ACCOUNT_TYPE
    data_type: VARCHAR
    description: 'Attribute ''account type''. Origin: FM Business Layer.Customer.AccountType'
    synonyms:
    - account type
  - name: customer_name
    expr: CUSTOMER_NAME
    data_type: VARCHAR
    description: 'Attribute ''customer name''. Origin: FM Business Layer.Customer.CustomerName'
    synonyms:
    - customer name
  - name: customer_segment
    expr: CUSTOMER_SEGMENT
    data_type: VARCHAR
    description: 'Attribute ''customer segment''. Origin: FM Business Layer.Customer.CustomerSegment'
    synonyms:
    - customer segment
  - name: service_tier
    expr: SERVICE_TIER
    data_type: VARCHAR
    description: 'Attribute ''service tier''. Origin: inferred from report usage (Energy_Billing_Package). TODO: map from
      CC_AND_B_PROD (Energy_Billing_Package); not in FM model or catalog'
    synonyms:
    - service tier
- name: location
  description: 'Dimension at Location grain. Source: ENERGY_DW.LOCATION. Origin: FM Business Layer.Location (conformed across
    Energy_Billing_Package, Energy_Operations_Package)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_LOCATION
  primary_key:
    columns:
    - LOCATION_ID
  synonyms:
  - location
  dimensions:
  - name: city
    expr: CITY
    data_type: VARCHAR
    description: 'Attribute ''city''. Origin: FM Business Layer.Location.City'
    synonyms:
    - city
  - name: region
    expr: REGION
    data_type: VARCHAR
    description: 'Attribute ''region''. Origin: FM Business Layer.Location.Region'
    synonyms:
    - region
relationships:
- name: meter_reading_to_dt
  left_table: meter_reading
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_reading_to_meter
  left_table: meter_reading
  right_table: meter
  relationship_columns:
  - left_column: METER_ID
    right_column: METER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_reading_to_tariff
  left_table: meter_reading
  right_table: tariff
  relationship_columns:
  - left_column: TARIFF_ID
    right_column: TARIFF_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_to_customer
  left_table: meter
  right_table: customer
  relationship_columns:
  - left_column: CUSTOMER_ID
    right_column: CUSTOMER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_to_location
  left_table: meter
  right_table: location
  relationship_columns:
  - left_column: LOCATION_ID
    right_column: LOCATION_ID
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: budget_billing_status
  question: What is the budget billing status by full date, customer id, customer name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, customer.CUSTOMER_ID AS customer_id, customer.CUSTOMER_NAME AS customer_name, customer.ACCOUNT_TYPE AS account_type, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: revenue_by_customer_segment
  question: What is the revenue by customer segment by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_SEGMENT AS customer_segment, location.REGION AS region, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __location AS location ON meter.LOCATION_ID = location.LOCATION_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: industrial_load_profile
  question: What is the industrial load profile by full date, month name, customer name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, customer.CUSTOMER_NAME AS customer_name, tariff.TARIFF_TYPE AS tariff_type, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh, MAX(meter_reading.PEAK_DEMAND_KW) AS max_peak_demand_kw, SUM(meter_reading.REACTIVE_KVARH) AS total_reactive_kvarh
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __tariff AS tariff ON meter_reading.TARIFF_ID = tariff.TARIFF_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: large_customer_account_review
  question: What is the large customer account review by customer id, customer name, service tier?
  sql: |-
    SELECT customer.CUSTOMER_ID AS customer_id, customer.CUSTOMER_NAME AS customer_name, customer.SERVICE_TIER AS service_tier, location.REGION AS region, tariff.TARIFF_TYPE AS tariff_type, MAX(meter_reading.PEAK_DEMAND_KW) AS max_peak_demand_kw
    FROM __meter_reading AS meter_reading
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __location AS location ON meter.LOCATION_ID = location.LOCATION_ID
    JOIN __tariff AS tariff ON meter_reading.TARIFF_ID = tariff.TARIFF_ID
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: interval_data_usage
  question: What is the interval data usage by full date, month name, is weekend?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.IS_WEEKEND AS is_weekend, customer.CUSTOMER_SEGMENT AS customer_segment, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh, SUM(meter_reading.OFF_PEAK_KWH) AS total_off_peak_kwh, MAX(meter_reading.PEAK_DEMAND_KW) AS max_peak_demand_kw
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: seasonal_consumption_trends
  question: What is the seasonal consumption trends by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, location.REGION AS region, customer.CUSTOMER_SEGMENT AS customer_segment, location.CITY AS city, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh, MAX(meter_reading.PEAK_DEMAND_KW) AS max_peak_demand_kw
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __location AS location ON meter.LOCATION_ID = location.LOCATION_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: meter_exchange_program
  question: What is the meter exchange program by full date, meter id, meter type?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, meter.METER_ID AS meter_id, meter.METER_TYPE AS meter_type, meter.IS_SMART_METER AS is_smart_meter, customer.CUSTOMER_NAME AS customer_name, location.REGION AS region, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __location AS location ON meter.LOCATION_ID = location.LOCATION_ID
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: monthly_invoice_detail
  question: What is the monthly invoice detail by full date, customer id, customer name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, customer.CUSTOMER_ID AS customer_id, customer.CUSTOMER_NAME AS customer_name, meter.METER_ID AS meter_id, tariff.TARIFF_TYPE AS tariff_type, meter.IS_SMART_METER AS is_smart_meter, SUM(meter_reading.CONSUMPTION_KWH) AS total_consumption_kwh
    FROM __meter_reading AS meter_reading
    JOIN __dt AS dt ON meter_reading.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON meter_reading.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __tariff AS tariff ON meter_reading.TARIFF_ID = tariff.TARIFF_ID
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
