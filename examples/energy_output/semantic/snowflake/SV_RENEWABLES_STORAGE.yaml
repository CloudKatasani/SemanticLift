verified_queries:
- name: energy_storage_utilization
  question: What is the energy storage utilization by full date, month name, asset name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, storage_asset.ASSET_NAME AS asset_name, power_plant.REGION AS region, power_plant.PLANT_NAME AS plant_name, MAX(storage_asset.STORAGE_CAPACITY_MWH) AS max_storage_capacity_mwh, AVG(storage_status.STATE_OF_CHARGE_PCT) AS avg_state_of_charge_pct, AVG(storage_status.DISCHARGE_RATE_MW) AS avg_discharge_rate_mw
    FROM __storage_asset AS storage_asset
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
