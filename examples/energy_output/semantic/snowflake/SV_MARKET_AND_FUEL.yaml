name: SV_MARKET_AND_FUEL
description: Market settlements and fuel cost (generated by SemLift 1.0.0)
tables:
- name: market_settlement
  description: 'Fact at MarketSettlement grain. Source: SAP_FICA_PROD.MARKET_SETTLEMENT. Origin: inferred from Energy_Finance_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_MARKET_SETTLEMENT
  primary_key:
    columns:
    - MARKET_SETTLEMENT_ID
  synonyms:
  - market settlement
  - market settlements
  dimensions:
  - name: market_type
    expr: MARKET_TYPE
    data_type: VARCHAR
    description: 'Attribute ''market type''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - market type
  facts:
  - name: energy_mwh
    expr: ENERGY_MWH
    data_type: NUMBER
    description: 'Measure ''energy mwh''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - energy mwh
  - name: price_mwh
    expr: PRICE_MWH
    data_type: NUMBER
    description: 'Measure ''price mwh''; default aggregation AVG (non-additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - price mwh
  - name: settlement_amount
    expr: SETTLEMENT_AMOUNT
    data_type: NUMBER
    description: 'Measure ''settlement amount''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - settlement amount
  - name: market_settlement_id
    expr: MARKET_SETTLEMENT_ID
    data_type: VARCHAR
    description: Grain key of FCT_MARKET_SETTLEMENT
  metrics:
  - name: total_energy_mwh
    expr: SUM(energy_mwh)
    description: SUM of energy mwh (additive; default aggregation from rule ADD-05:MWh)
    synonyms:
    - total energy mwh
    - energy mwh
  - name: avg_price_mwh
    expr: AVG(price_mwh)
    description: AVG of price mwh (non-additive; default aggregation from rule ADD-02:Price)
    synonyms:
    - avg price mwh
    - price mwh
  - name: total_settlement_amount
    expr: SUM(settlement_amount)
    description: SUM of settlement amount (additive; default aggregation from rule ADD-05:Amount)
    synonyms:
    - total settlement amount
    - settlement amount
  - name: market_settlement_count
    expr: COUNT(market_settlement_id)
    description: Number of market settlement rows
    synonyms:
    - number of market settlements
- name: fuel_cost
  description: 'Fact at FuelCost grain. Source: SAP_FICA_PROD.FUEL_COST. Origin: inferred from Energy_Finance_Package report
    usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_FUEL_COST
  primary_key:
    columns:
    - FUEL_COST_ID
  synonyms:
  - fuel cost
  - fuel costs
  dimensions:
  - name: fuel_type
    expr: FUEL_TYPE
    data_type: VARCHAR
    description: 'Attribute ''fuel type''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - fuel type
  facts:
  - name: cost_per_mmbtu
    expr: COST_PER_MMBTU
    data_type: NUMBER
    description: 'Measure ''cost per mmbtu''; default aggregation AVG (non-additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - cost per mmbtu
  - name: quantity_mmbtu
    expr: QUANTITY_MMBTU
    data_type: NUMBER
    description: 'Measure ''quantity mmbtu''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - quantity mmbtu
  - name: total_cost
    expr: TOTAL_COST
    data_type: NUMBER
    description: 'Measure ''total cost''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - total cost
  - name: fuel_cost_id
    expr: FUEL_COST_ID
    data_type: VARCHAR
    description: Grain key of FCT_FUEL_COST
  metrics:
  - name: avg_cost_per_mmbtu
    expr: AVG(cost_per_mmbtu)
    description: AVG of cost per mmbtu (non-additive; default aggregation from rule ADD-02:Per)
    synonyms:
    - avg cost per mmbtu
    - cost per mmbtu
  - name: total_quantity_mmbtu
    expr: SUM(quantity_mmbtu)
    description: SUM of quantity mmbtu (additive; default aggregation from rule ADD-05:Quantity)
    synonyms:
    - total quantity mmbtu
    - quantity mmbtu
  - name: total_cost_sum
    expr: SUM(total_cost)
    description: SUM of total cost (additive; default aggregation from rule ADD-05:Cost)
    synonyms:
    - total cost sum
    - total cost
  - name: fuel_cost_count
    expr: COUNT(fuel_cost_id)
    description: Number of fuel cost rows
    synonyms:
    - number of fuel costs
- name: counterparty
  description: Reference dimension COUNTERPARTY derived from distinct MarketSettlement.CounterpartyID values until a master
    table is mapped (rule DIM-03)
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_COUNTERPARTY
  primary_key:
    columns:
    - COUNTERPARTY_ID
  synonyms:
  - counterparty
  dimensions:
  - name: counterparty_id
    expr: COUNTERPARTY_ID
    data_type: VARCHAR
    description: Reference key from MarketSettlement.CounterpartyID
    synonyms:
    - counterparty id
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
- name: gl_account
  description: 'Dimension at GLAccount grain. Source: SAP_FICA_PROD.GL_ACCOUNT. Origin: inferred from Energy_Finance_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_GL_ACCOUNT
  primary_key:
    columns:
    - GL_ACCOUNT_ID
  synonyms:
  - gl account
  dimensions:
  - name: account_code
    expr: ACCOUNT_CODE
    data_type: VARCHAR
    description: 'Attribute ''account code''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - account code
  - name: account_name
    expr: ACCOUNT_NAME
    data_type: VARCHAR
    description: 'Attribute ''account name''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - account name
- name: cost_center
  description: Reference dimension COST_CENTER derived from distinct GLAccount.CostCenter values until a master table is mapped
    (rule DIM-03)
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_COST_CENTER
  primary_key:
    columns:
    - COST_CENTER
  synonyms:
  - cost center
  dimensions:
  - name: cost_center
    expr: COST_CENTER
    data_type: VARCHAR
    description: Reference key from GLAccount.CostCenter
    synonyms:
    - cost center
relationships:
- name: market_settlement_to_counterparty
  left_table: market_settlement
  right_table: counterparty
  relationship_columns:
  - left_column: COUNTERPARTY_ID
    right_column: COUNTERPARTY_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: market_settlement_to_dt
  left_table: market_settlement
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: market_settlement_to_gl_account
  left_table: market_settlement
  right_table: gl_account
  relationship_columns:
  - left_column: GL_ACCOUNT_ID
    right_column: GL_ACCOUNT_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: fuel_cost_to_dt
  left_table: fuel_cost
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: fuel_cost_to_gl_account
  left_table: fuel_cost
  right_table: gl_account
  relationship_columns:
  - left_column: GL_ACCOUNT_ID
    right_column: GL_ACCOUNT_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: gl_account_to_cost_center
  left_table: gl_account
  right_table: cost_center
  relationship_columns:
  - left_column: COST_CENTER
    right_column: COST_CENTER
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: vendor_invoice_aging
  question: What is the vendor invoice aging by month name, fiscal year, account name for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_NAME AS account_name, cost_center.COST_CENTER AS cost_center, fuel_cost.FUEL_TYPE AS fuel_type, SUM(fuel_cost.TOTAL_COST) AS total_cost_sum
    FROM __fuel_cost AS fuel_cost
    JOIN __dt AS dt ON fuel_cost.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON fuel_cost.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    JOIN __cost_center AS cost_center ON gl_account.COST_CENTER = cost_center.COST_CENTER
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: hedging_position_summary
  question: What is the hedging position summary by month name, fiscal year, fuel type for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, fuel_cost.FUEL_TYPE AS fuel_type, gl_account.ACCOUNT_CODE AS account_code, AVG(fuel_cost.COST_PER_MMBTU) AS avg_cost_per_mmbtu, AVG(market_settlement.PRICE_MWH) AS avg_price_mwh, SUM(market_settlement.SETTLEMENT_AMOUNT) AS total_settlement_amount
    FROM __fuel_cost AS fuel_cost
    JOIN __dt AS dt ON fuel_cost.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON fuel_cost.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: wholesale_market_settlement
  question: What is the wholesale market settlement by month name, fiscal year, market type for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, market_settlement.MARKET_TYPE AS market_type, counterparty.COUNTERPARTY_ID AS counterparty_id, SUM(market_settlement.ENERGY_MWH) AS total_energy_mwh, AVG(market_settlement.PRICE_MWH) AS avg_price_mwh, SUM(market_settlement.SETTLEMENT_AMOUNT) AS total_settlement_amount
    FROM __market_settlement AS market_settlement
    JOIN __dt AS dt ON market_settlement.DATE_KEY = dt.DATE_KEY
    JOIN __counterparty AS counterparty ON market_settlement.COUNTERPARTY_ID = counterparty.COUNTERPARTY_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: cost_of_capital_analysis
  question: What is the cost of capital analysis by fiscal year, account name, market type for fiscal year 2026?
  sql: |-
    SELECT dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_NAME AS account_name, market_settlement.MARKET_TYPE AS market_type, AVG(market_settlement.PRICE_MWH) AS avg_price_mwh
    FROM __market_settlement AS market_settlement
    JOIN __dt AS dt ON market_settlement.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON market_settlement.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: fuel_cost_variance
  question: What is the fuel cost variance by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, fuel_cost.FUEL_TYPE AS fuel_type, SUM(fuel_cost.QUANTITY_MMBTU) AS total_quantity_mmbtu, AVG(fuel_cost.COST_PER_MMBTU) AS avg_cost_per_mmbtu, SUM(fuel_cost.TOTAL_COST) AS total_cost_sum
    FROM __fuel_cost AS fuel_cost
    JOIN __dt AS dt ON fuel_cost.DATE_KEY = dt.DATE_KEY
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: credit_rating_metrics
  question: What is the credit rating metrics by quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, SUM(market_settlement.SETTLEMENT_AMOUNT) AS total_settlement_amount
    FROM __market_settlement AS market_settlement
    JOIN __dt AS dt ON market_settlement.DATE_KEY = dt.DATE_KEY
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
