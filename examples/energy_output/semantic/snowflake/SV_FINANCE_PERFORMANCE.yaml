  join_type: left_outer
  relationship_type: many_to_one
- name: capex_spend_to_dt
  left_table: capex_spend
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: capex_spend_to_gl_account
  left_table: capex_spend
