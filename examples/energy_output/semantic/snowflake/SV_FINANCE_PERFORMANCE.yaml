- name: earnings_per_share_drivers
  question: What is the earnings per share drivers by quarter, fiscal year, revenue type for fiscal year 2026?
  sql: |-
    SELECT dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, revenue.REVENUE_TYPE AS revenue_type, dt.MONTH_NAME AS month_name, SUM(revenue.AMOUNT) AS total_amount, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, AVG(budget_actual.VARIANCE_PCT) AS avg_variance_pct, SUM(revenue.KWH_SOLD) AS total_kwh_sold
