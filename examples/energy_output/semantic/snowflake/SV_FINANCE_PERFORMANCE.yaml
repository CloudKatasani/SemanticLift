name: SV_FINANCE_PERFORMANCE
description: Budget vs actual (generated by SemLift 1.0.0)
tables:
- name: budget_actual
  description: 'Fact at BudgetActual grain. Source: SAP_FICA_PROD.BUDGET_ACTUAL. Origin: inferred from Energy_Finance_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_BUDGET_ACTUAL
  primary_key:
    columns:
    - BUDGET_ACTUAL_ID
  synonyms:
  - budget actual
  - budget actuals
  facts:
  - name: actual_amount
    expr: ACTUAL_AMOUNT
    data_type: NUMBER
    description: 'Measure ''actual amount''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - actual amount
  - name: budget_amount
    expr: BUDGET_AMOUNT
    data_type: NUMBER
    description: 'Measure ''budget amount''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - budget amount
  - name: variance_amount
    expr: VARIANCE_AMOUNT
    data_type: NUMBER
    description: 'Measure ''variance amount''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - variance amount
  - name: variance_pct
    expr: VARIANCE_PCT
    data_type: NUMBER
    description: 'Measure ''variance pct''; default aggregation AVG (non-additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - variance pct
  - name: budget_actual_id
    expr: BUDGET_ACTUAL_ID
    data_type: VARCHAR
    description: Grain key of FCT_BUDGET_ACTUAL
  metrics:
  - name: total_actual_amount
    expr: SUM(actual_amount)
    description: SUM of actual amount (additive; default aggregation from rule ADD-05:Amount)
    synonyms:
    - total actual amount
    - actual amount
  - name: total_budget_amount
    expr: SUM(budget_amount)
    description: SUM of budget amount (additive; default aggregation from rule ADD-05:Amount)
    synonyms:
    - total budget amount
    - budget amount
  - name: total_variance_amount
    expr: SUM(variance_amount)
    description: SUM of variance amount (additive; default aggregation from rule ADD-05:Amount)
    synonyms:
    - total variance amount
    - variance amount
  - name: avg_variance_pct
    expr: AVG(variance_pct)
    description: AVG of variance pct (non-additive; default aggregation from rule ADD-02:Pct)
    synonyms:
    - avg variance pct
    - variance pct
  - name: budget_actual_count
    expr: COUNT(budget_actual_id)
    description: Number of budget actual rows
    synonyms:
    - number of budget actuals
- name: revenue
  description: 'Fact at RevenueRecord grain. Source: SAP_FICA_PROD.REVENUE_RECORD. Origin: inferred from Energy_Finance_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_REVENUE
  primary_key:
    columns:
    - REVENUE_RECORD_ID
  synonyms:
  - revenue record
  - revenue records
  dimensions:
  - name: customer_segment
    expr: CUSTOMER_SEGMENT
    data_type: VARCHAR
    description: 'Attribute ''customer segment''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - customer segment
  - name: revenue_type
    expr: REVENUE_TYPE
    data_type: VARCHAR
    description: 'Attribute ''revenue type''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - revenue type
  facts:
  - name: amount
    expr: AMOUNT
    data_type: NUMBER
    description: 'Measure ''amount''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - amount
  - name: kwh_sold
    expr: KWH_SOLD
    data_type: NUMBER
    description: 'Measure ''kwh sold''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - kwh sold
  - name: revenue_per_kwh
    expr: REVENUE_PER_KWH
    data_type: NUMBER
    description: 'Measure ''revenue per kwh''; default aggregation AVG (non-additive). Origin: inferred from report usage
      (Energy_Finance_Package)'
    synonyms:
    - revenue per kwh
  - name: revenue_record_id
    expr: REVENUE_RECORD_ID
    data_type: VARCHAR
    description: Grain key of FCT_REVENUE
  metrics:
  - name: total_amount
    expr: SUM(amount)
    description: SUM of amount (additive; default aggregation from rule ADD-05:Amount)
    synonyms:
    - total amount
    - amount
  - name: total_kwh_sold
    expr: SUM(kwh_sold)
    description: SUM of kwh sold (additive; default aggregation from rule ADD-05:KWh)
    synonyms:
    - total kwh sold
    - kwh sold
  - name: avg_revenue_per_kwh
    expr: AVG(revenue_per_kwh)
    description: AVG of revenue per kwh (non-additive; default aggregation from rule ADD-02:Per)
    synonyms:
    - avg revenue per kwh
    - revenue per kwh
  - name: revenue_count
    expr: COUNT(revenue_record_id)
    description: Number of revenue record rows
    synonyms:
    - number of revenue records
- name: capex_project
  description: 'Dimension for CapexProject (split from report usage, rule DIM-02). Source: RAW_SAP_FICA.CAPEX_PROJECT (TODO
    confirm)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_CAPEX_PROJECT
  primary_key:
    columns:
    - CAPEX_PROJECT_ID
  synonyms:
  - capex project
  dimensions:
  - name: category
    expr: CATEGORY
    data_type: VARCHAR
    description: 'Attribute ''category''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - category
  facts:
  - name: approved_budget
    expr: APPROVED_BUDGET
    data_type: NUMBER
    description: 'Measure ''approved budget''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)
      (static attribute of the master record)'
    synonyms:
    - approved budget
  metrics:
  - name: total_approved_budget
    expr: SUM(approved_budget)
    description: SUM of approved budget (additive; default aggregation from rule ADD-05:Budget)
    synonyms:
    - total approved budget
    - approved budget
- name: capex_spend
  description: 'Fact CAPEX_SPEND for CapexProject measurements (rule DIM-02). Source: RAW_SAP_FICA.CAPEX_PROJECT (TODO confirm)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_CAPEX_SPEND
  primary_key:
    columns:
    - CAPEX_SPEND_ID
  synonyms:
  - capex project
  - capex projects
  facts:
  - name: spent_to_date
    expr: SPENT_TO_DATE
    data_type: DATE
    description: 'Measure ''spent to date''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - spent to date
  - name: capex_spend_id
    expr: CAPEX_SPEND_ID
    data_type: VARCHAR
    description: Grain key of FCT_CAPEX_SPEND
  metrics:
  - name: total_spent_to_date
    expr: SUM(spent_to_date)
    description: SUM of spent to date (additive; default aggregation from rule ADD-05:Spent)
    synonyms:
    - total spent to date
    - spent to date
  - name: capex_spend_count
    expr: COUNT(capex_spend_id)
    description: Number of capex project rows
    synonyms:
    - number of capex projects
- name: gl_account
  description: 'Dimension at GLAccount grain. Source: SAP_FICA_PROD.GL_ACCOUNT. Origin: inferred from Energy_Finance_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_GL_ACCOUNT
  primary_key:
    columns:
    - GL_ACCOUNT_ID
  synonyms:
  - gl account
  dimensions:
  - name: account_code
    expr: ACCOUNT_CODE
    data_type: VARCHAR
    description: 'Attribute ''account code''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - account code
  - name: account_name
    expr: ACCOUNT_NAME
    data_type: VARCHAR
    description: 'Attribute ''account name''. Origin: inferred from report usage (Energy_Finance_Package)'
    synonyms:
    - account name
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: month_number
    expr: MONTH_NUMBER
    data_type: NUMBER
    description: 'Attribute ''month number''. Origin: FM Business Layer.Date.MonthNumber'
    synonyms:
    - month number
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
- name: cost_center
  description: Reference dimension COST_CENTER derived from distinct GLAccount.CostCenter values until a master table is mapped
    (rule DIM-03)
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_COST_CENTER
  primary_key:
    columns:
    - COST_CENTER
  synonyms:
  - cost center
  dimensions:
  - name: cost_center
    expr: COST_CENTER
    data_type: VARCHAR
    description: Reference key from GLAccount.CostCenter
    synonyms:
    - cost center
