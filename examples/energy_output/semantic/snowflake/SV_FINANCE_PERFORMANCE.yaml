- name: cost_of_capital_analysis
  question: What is the cost of capital analysis by fiscal year, account name for fiscal year 2026?
  sql: |-
    SELECT dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_NAME AS account_name, SUM(budget_actual.BUDGET_AMOUNT) AS total_budget_amount, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, SUM(revenue.AMOUNT) AS total_amount, SUM(capex_project.APPROVED_BUDGET) AS total_approved_budget
