- name: insurance_premium_summary
  question: What is the insurance premium summary by month name, fiscal year, account name for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_NAME AS account_name, cost_center.COST_CENTER AS cost_center, SUM(budget_actual.BUDGET_AMOUNT) AS total_budget_amount, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, SUM(budget_actual.VARIANCE_AMOUNT) AS total_variance_amount, AVG(budget_actual.VARIANCE_PCT) AS avg_variance_pct
    FROM __budget_actual AS budget_actual
    JOIN __dt AS dt ON budget_actual.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON budget_actual.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    JOIN __cost_center AS cost_center ON gl_account.COST_CENTER = cost_center.COST_CENTER
