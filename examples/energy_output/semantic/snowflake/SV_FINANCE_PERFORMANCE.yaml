  relationship_type: many_to_one
verified_queries:
- name: treasury_cash_position
  question: What is the treasury cash position by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_CODE AS account_code, gl_account.ACCOUNT_NAME AS account_name, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, SUM(budget_actual.VARIANCE_AMOUNT) AS total_variance_amount
    FROM __budget_actual AS budget_actual
    JOIN __dt AS dt ON budget_actual.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON budget_actual.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: payroll_cost_allocation
  question: What is the payroll cost allocation by month name, fiscal year, cost center for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, cost_center.COST_CENTER AS cost_center, gl_account.ACCOUNT_NAME AS account_name, dt.MONTH_NUMBER AS month_number, SUM(budget_actual.BUDGET_AMOUNT) AS total_budget_amount, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, AVG(budget_actual.VARIANCE_PCT) AS avg_variance_pct, SUM(budget_actual.VARIANCE_AMOUNT) AS total_variance_amount
    FROM __budget_actual AS budget_actual
    JOIN __dt AS dt ON budget_actual.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON budget_actual.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    JOIN __cost_center AS cost_center ON gl_account.COST_CENTER = cost_center.COST_CENTER
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: budget_vs_actual_summary
  question: What is the budget vs actual summary by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_CODE AS account_code, gl_account.ACCOUNT_NAME AS account_name, cost_center.COST_CENTER AS cost_center, SUM(budget_actual.BUDGET_AMOUNT) AS total_budget_amount, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, SUM(budget_actual.VARIANCE_AMOUNT) AS total_variance_amount, AVG(budget_actual.VARIANCE_PCT) AS avg_variance_pct
    FROM __budget_actual AS budget_actual
    JOIN __dt AS dt ON budget_actual.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON budget_actual.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    JOIN __cost_center AS cost_center ON gl_account.COST_CENTER = cost_center.COST_CENTER
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: debt_maturity_schedule
  question: What is the debt maturity schedule by month name, fiscal year, account code for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, gl_account.ACCOUNT_CODE AS account_code, gl_account.ACCOUNT_NAME AS account_name, SUM(budget_actual.ACTUAL_AMOUNT) AS total_actual_amount, SUM(budget_actual.VARIANCE_AMOUNT) AS total_variance_amount, SUM(capex_project.APPROVED_BUDGET) AS total_approved_budget
    FROM __budget_actual AS budget_actual
    JOIN __dt AS dt ON budget_actual.DATE_KEY = dt.DATE_KEY
    JOIN __gl_account AS gl_account ON budget_actual.GL_ACCOUNT_ID = gl_account.GL_ACCOUNT_ID
    WHERE dt.FISCAL_YEAR = 2026
