name: SV_EV_CHARGING
description: EV charging sessions (generated by SemanticLift 1.0.0)
tables:
- name: ev_charging
  description: 'Fact at EVCharging grain. Source: SF_SERVICE_CLOUD.EV_CHARGING. Origin: inferred from Energy_CustomerService_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_EV_CHARGING
  primary_key:
    columns:
    - EV_CHARGING_ID
  synonyms:
  - ev charging
  - ev chargings
  facts:
  - name: cost
    expr: COST
    data_type: NUMBER
    description: 'Measure ''cost''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_CustomerService_Package)'
    synonyms:
    - cost
  - name: energy_delivered_kwh
    expr: ENERGY_DELIVERED_KWH
    data_type: NUMBER
    description: 'Measure ''energy delivered kwh''; default aggregation SUM (additive). Origin: inferred from report usage
      (Energy_CustomerService_Package)'
    synonyms:
    - energy delivered kwh
  - name: peak_kw
    expr: PEAK_KW
    data_type: NUMBER
    description: 'Measure ''peak kw''; default aggregation MAX (semi-additive). Origin: inferred from report usage (Energy_CustomerService_Package)'
    synonyms:
    - peak kw
  - name: ev_charging_id
    expr: EV_CHARGING_ID
    data_type: VARCHAR
    description: Grain key of FCT_EV_CHARGING
  metrics:
  - name: total_cost
    expr: SUM(cost)
    description: SUM of cost (additive; default aggregation from rule ADD-05:Cost)
    synonyms:
    - total cost
    - cost
  - name: total_energy_delivered_kwh
    expr: SUM(energy_delivered_kwh)
    description: SUM of energy delivered kwh (additive; default aggregation from rule ADD-05:KWh)
    synonyms:
    - total energy delivered kwh
    - energy delivered kwh
  - name: max_peak_kw
    expr: MAX(peak_kw)
    description: MAX of peak kw (semi-additive; default aggregation from rule ADD-03:Peak)
    synonyms:
    - max peak kw
    - peak kw
  - name: ev_charging_count
    expr: COUNT(ev_charging_id)
    description: Number of ev charging rows
    synonyms:
    - number of ev chargings
- name: charger
  description: Reference dimension CHARGER derived from distinct EVCharging.ChargerID values until a master table is mapped
    (rule DIM-03)
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_CHARGER
  primary_key:
    columns:
    - CHARGER_ID
  synonyms:
  - charger
  dimensions:
  - name: charger_id
    expr: CHARGER_ID
    data_type: VARCHAR
    description: Reference key from EVCharging.ChargerID
    synonyms:
    - charger id
- name: customer
  description: 'Dimension at Customer grain. Source: ENERGY_DW.CUSTOMER. Origin: FM Business Layer.Customer (conformed across
    Energy_Billing_Package, Energy_CustomerService_Package)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_CUSTOMER
  primary_key:
    columns:
    - CUSTOMER_ID
  synonyms:
  - customer
  dimensions:
  - name: customer_name
    expr: CUSTOMER_NAME
    data_type: VARCHAR
    description: 'Attribute ''customer name''. Origin: FM Business Layer.Customer.CustomerName'
    synonyms:
    - customer name
  - name: customer_segment
    expr: CUSTOMER_SEGMENT
    data_type: VARCHAR
    description: 'Attribute ''customer segment''. Origin: FM Business Layer.Customer.CustomerSegment'
    synonyms:
    - customer segment
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: is_weekend
    expr: IS_WEEKEND
    data_type: BOOLEAN
    description: 'Attribute ''is weekend''. Origin: FM Business Layer.Date.IsWeekend'
    synonyms:
    - is weekend
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  time_dimensions:
  - name: full_date
    expr: FULL_DATE
    data_type: DATE
    description: 'Attribute ''full date''. Origin: FM Business Layer.Date.FullDate'
    synonyms:
    - full date
    - reading date
    - bill date
    - gen date
    - event date
    - request date
relationships:
- name: ev_charging_to_charger
  left_table: ev_charging
  right_table: charger
  relationship_columns:
  - left_column: CHARGER_ID
    right_column: CHARGER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: ev_charging_to_customer
  left_table: ev_charging
  right_table: customer
  relationship_columns:
  - left_column: CUSTOMER_ID
    right_column: CUSTOMER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: ev_charging_to_dt
  left_table: ev_charging
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: community_solar_enrollment
  question: What is the community solar enrollment by full date, fiscal year, customer name for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_NAME AS customer_name, customer.CUSTOMER_SEGMENT AS customer_segment, dt.MONTH_NAME AS month_name, SUM(ev_charging.ENERGY_DELIVERED_KWH) AS total_energy_delivered_kwh
    FROM __ev_charging AS ev_charging
    JOIN __dt AS dt ON ev_charging.DATE_KEY = dt.DATE_KEY
    JOIN __customer AS customer ON ev_charging.CUSTOMER_ID = customer.CUSTOMER_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: ev_charging_demand_forecast
  question: What is the ev charging demand forecast by full date, month name, is weekend?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.IS_WEEKEND AS is_weekend, charger.CHARGER_ID AS charger_id, SUM(ev_charging.ENERGY_DELIVERED_KWH) AS total_energy_delivered_kwh, MAX(ev_charging.PEAK_KW) AS max_peak_kw, SUM(ev_charging.COST) AS total_cost
    FROM __ev_charging AS ev_charging
    JOIN __dt AS dt ON ev_charging.DATE_KEY = dt.DATE_KEY
    JOIN __charger AS charger ON ev_charging.CHARGER_ID = charger.CHARGER_ID
    GROUP BY 1, 2, 3, 4
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: electric_vehicle_incentives
  question: What is the electric vehicle incentives by full date, fiscal year, customer name for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_NAME AS customer_name, customer.CUSTOMER_SEGMENT AS customer_segment, SUM(ev_charging.ENERGY_DELIVERED_KWH) AS total_energy_delivered_kwh, SUM(ev_charging.COST) AS total_cost
    FROM __ev_charging AS ev_charging
    JOIN __dt AS dt ON ev_charging.DATE_KEY = dt.DATE_KEY
    JOIN __customer AS customer ON ev_charging.CUSTOMER_ID = customer.CUSTOMER_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
