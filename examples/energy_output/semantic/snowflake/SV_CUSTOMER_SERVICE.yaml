verified_queries:
- name: payment_plan_enrollment
  question: What is the payment plan enrollment by full date, fiscal year, customer name for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_NAME AS customer_name, customer.CUSTOMER_SEGMENT AS customer_segment, service_request.REQUEST_TYPE AS request_type, service_request.STATUS AS status, SUM(customer.LIFETIME_VALUE_USD) AS total_lifetime_value_usd
    FROM __customer AS customer
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: new_service_connect_times
  question: What is the new service connect times by full date, month name, customer name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, customer.CUSTOMER_NAME AS customer_name, customer.CUSTOMER_SEGMENT AS customer_segment, service_request.REQUEST_TYPE AS request_type, service_request.STATUS AS status, SUM(field_service.DURATION) AS total_duration
    FROM __field_service AS field_service
    JOIN __dt AS dt ON field_service.DATE_KEY = dt.DATE_KEY
    JOIN __customer AS customer ON field_service.CUSTOMER_ID = customer.CUSTOMER_ID
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: customer_satisfaction_summary
  question: What is the customer satisfaction summary by full date, month name, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_SEGMENT AS customer_segment, service_request.REQUEST_TYPE AS request_type, service_request.STATUS AS status, AVG(customer.NPS_SCORE) AS avg_nps_score
    FROM __customer AS customer
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: field_service_efficiency
  question: What is the field service efficiency by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, technician.TECHNICIAN_ID AS technician_id, field_service.VISIT_TYPE AS visit_type, field_service.OUTCOME AS outcome, SUM(field_service.DURATION) AS total_duration
    FROM __field_service AS field_service
    JOIN __dt AS dt ON field_service.DATE_KEY = dt.DATE_KEY
    JOIN __technician AS technician ON field_service.TECHNICIAN_ID = technician.TECHNICIAN_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: nps_trend_report
  question: What is the nps trend report by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_SEGMENT AS customer_segment, complaint.SEVERITY AS severity, service_request.STATUS AS status, AVG(customer.NPS_SCORE) AS avg_nps_score
    FROM __customer AS customer
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: customer_lifetime_value
  question: What is the customer lifetime value by month name, fiscal year, customer segment for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_SEGMENT AS customer_segment, customer.CHURN_RISK AS churn_risk, SUM(customer.LIFETIME_VALUE_USD) AS total_lifetime_value_usd, AVG(customer.NPS_SCORE) AS avg_nps_score
    FROM __customer AS customer
    GROUP BY 1, 2, 3, 4
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: social_media_sentiment
  question: What is the social media sentiment by full date, month name, customer segment?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, customer.CUSTOMER_SEGMENT AS customer_segment, complaint.CATEGORY AS category, complaint.SEVERITY AS severity, service_request.STATUS AS status, AVG(customer.NPS_SCORE) AS avg_nps_score
    FROM __customer AS customer
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
custom_instructions: 'Unless the user specifies otherwise, apply default filters: fiscal_year = 2026'
