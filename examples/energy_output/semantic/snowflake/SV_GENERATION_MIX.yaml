  use_as_onboarding_question: false
- name: generation_forecast_accuracy
  question: What is the generation forecast accuracy by month name, quarter, plant name for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, power_plant.PLANT_NAME AS plant_name, energy_source.SOURCE_NAME AS source_name, dt.FISCAL_YEAR AS fiscal_year, SUM(generation.GENERATED_MWH) AS total_generated_mwh, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg, MAX(power_plant.INSTALLED_CAPACITY_MW) AS max_installed_capacity_mw
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __power_plant AS power_plant ON generation.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
    JOIN __energy_source AS energy_source ON generation.SOURCE_ID = energy_source.SOURCE_ID
