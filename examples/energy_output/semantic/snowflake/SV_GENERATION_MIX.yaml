  use_as_onboarding_question: false
- name: renewable_generation_mix
  question: What is the renewable generation mix by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, energy_source.SOURCE_NAME AS source_name, energy_source.SOURCE_CATEGORY AS source_category, SUM(generation.GENERATED_MWH) AS total_generated_mwh, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __energy_source AS energy_source ON generation.SOURCE_ID = energy_source.SOURCE_ID
    WHERE dt.FISCAL_YEAR = 2026
