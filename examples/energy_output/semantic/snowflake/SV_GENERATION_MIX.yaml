  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: curtailment_events
  question: What is the curtailment events by full date, month name, plant name?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, power_plant.PLANT_NAME AS plant_name, power_plant.REGION AS region, MAX(generation.CAPACITY_MW) AS max_capacity_mw, SUM(generation.GENERATED_MWH) AS total_generated_mwh, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg, MAX(power_plant.INSTALLED_CAPACITY_MW) AS max_installed_capacity_mw
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __power_plant AS power_plant ON generation.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
