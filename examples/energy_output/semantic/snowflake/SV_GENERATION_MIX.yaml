name: SV_GENERATION_MIX
description: Generation output (generated by SemanticLift 1.0.0)
tables:
- name: generation
  description: 'Fact at Generation grain. Source: PI_HISTORIAN_PROD.GENERATION. Origin: FM Business Layer.Generation'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_GENERATION
  primary_key:
    columns:
    - GENERATION_ID
  synonyms:
  - generation
  - generations
  facts:
  - name: co2_emissions_kg
    expr: CO2_EMISSIONS_KG
    data_type: NUMBER
    description: 'Measure ''co2 emissions kg''; default aggregation SUM (additive). Origin: FM Business Layer.Generation.CO2EmissionsKg'
    synonyms:
    - co2 emissions kg
  - name: capacity_factor_pct
    expr: CAPACITY_FACTOR_PCT
    data_type: NUMBER
    description: 'Measure ''capacity factor pct''; default aggregation AVG (non-additive). Origin: FM Business Layer.Generation.CapacityFactorPct'
    synonyms:
    - capacity factor pct
  - name: capacity_mw
    expr: CAPACITY_MW
    data_type: NUMBER
    description: 'Measure ''capacity mw''; default aggregation MAX (semi-additive). Origin: FM Business Layer.Generation.CapacityMW'
    synonyms:
    - capacity mw
  - name: fuel_cost_per_mwh
    expr: FUEL_COST_PER_MWH
    data_type: NUMBER
    description: 'Measure ''fuel cost per mwh''; default aggregation AVG (non-additive). Origin: inferred from report usage
      (Energy_Generation_Package). TODO: map from PI_HISTORIAN_PROD (Energy_Generation_Package); not ...'
    synonyms:
    - fuel cost per mwh
  - name: generated_mwh
    expr: GENERATED_MWH
    data_type: NUMBER
    description: 'Measure ''generated mwh''; default aggregation SUM (additive). Origin: FM Business Layer.Generation.GeneratedMWh'
    synonyms:
    - generated mwh
  - name: generation_id
    expr: GENERATION_ID
    data_type: VARCHAR
    description: Grain key of FCT_GENERATION
  metrics:
  - name: total_co2_emissions_kg
    expr: SUM(co2_emissions_kg)
    description: SUM of co2 emissions kg (additive; default aggregation from FM)
    synonyms:
    - total co2 emissions kg
    - co2 emissions kg
  - name: avg_capacity_factor_pct
    expr: AVG(capacity_factor_pct)
    description: AVG of capacity factor pct (non-additive; default aggregation from FM)
    synonyms:
    - avg capacity factor pct
    - capacity factor pct
  - name: max_capacity_mw
    expr: MAX(capacity_mw)
    description: MAX of capacity mw (semi-additive; default aggregation from FM)
    synonyms:
    - max capacity mw
    - capacity mw
  - name: avg_fuel_cost_per_mwh
    expr: AVG(fuel_cost_per_mwh)
    description: AVG of fuel cost per mwh (non-additive; default aggregation from rule ADD-02:Per)
    synonyms:
    - avg fuel cost per mwh
    - fuel cost per mwh
  - name: total_generated_mwh
    expr: SUM(generated_mwh)
    description: SUM of generated mwh (additive; default aggregation from FM)
    synonyms:
    - total generated mwh
    - generated mwh
  - name: co2_intensity_kg_per_mwh
    expr: SUM(co2_emissions_kg) / NULLIF(SUM(generated_mwh), 0)
    description: Ratio metric from FM calculation Generation.CO2IntensityKgPerMWh (regularAggregate=calculated)
    synonyms:
    - co2 intensity kg per mwh
  - name: generation_count
    expr: COUNT(generation_id)
    description: Number of generation rows
    synonyms:
    - number of generations
- name: power_plant
  description: 'Dimension at PowerPlant grain. Source: PI_HISTORIAN_PROD.POWER_PLANT. Origin: inferred from Energy_Generation_Package
    report usage'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_POWER_PLANT
  primary_key:
    columns:
    - POWER_PLANT_ID
  synonyms:
  - power plant
  dimensions:
  - name: plant_name
    expr: PLANT_NAME
    data_type: VARCHAR
    description: 'Attribute ''plant name''. Origin: inferred from report usage (Energy_Generation_Package)'
    synonyms:
    - plant name
  - name: plant_type
    expr: PLANT_TYPE
    data_type: VARCHAR
    description: 'Attribute ''plant type''. Origin: inferred from report usage (Energy_Generation_Package)'
    synonyms:
    - plant type
  - name: region
    expr: REGION
    data_type: VARCHAR
    description: 'Attribute ''region''. Origin: inferred from report usage (Energy_Generation_Package)'
    synonyms:
    - region
  facts:
  - name: installed_capacity_mw
    expr: INSTALLED_CAPACITY_MW
    data_type: NUMBER
    description: 'Measure ''installed capacity mw''; default aggregation MAX (semi-additive). Origin: inferred from report
      usage (Energy_Generation_Package)'
    synonyms:
    - installed capacity mw
  metrics:
  - name: max_installed_capacity_mw
    expr: MAX(installed_capacity_mw)
    description: MAX of installed capacity mw (semi-additive; default aggregation from rule ADD-03:Capacity)
    synonyms:
    - max installed capacity mw
    - installed capacity mw
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: is_weekend
    expr: IS_WEEKEND
    data_type: BOOLEAN
    description: 'Attribute ''is weekend''. Origin: FM Business Layer.Date.IsWeekend'
    synonyms:
    - is weekend
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
  time_dimensions:
  - name: full_date
    expr: FULL_DATE
    data_type: DATE
    description: 'Attribute ''full date''. Origin: FM Business Layer.Date.FullDate'
    synonyms:
    - full date
    - reading date
    - bill date
    - gen date
    - event date
    - request date
- name: energy_source
  description: 'Dimension at EnergySource grain. Source: PI_HISTORIAN_PROD.ENERGY_SOURCE. Origin: FM Business Layer.EnergySource'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_ENERGY_SOURCE
  primary_key:
    columns:
    - SOURCE_ID
  synonyms:
  - energy source
  dimensions:
  - name: is_rec_eligible
    expr: IS_REC_ELIGIBLE
    data_type: BOOLEAN
    description: 'Attribute ''is rec eligible''. Origin: FM Business Layer.EnergySource.IsRECEligible'
    synonyms:
    - is rec eligible
  - name: source_category
    expr: SOURCE_CATEGORY
    data_type: VARCHAR
    description: 'Attribute ''source category''. Origin: FM Business Layer.EnergySource.SourceCategory'
    synonyms:
    - source category
  - name: source_name
    expr: SOURCE_NAME
    data_type: VARCHAR
    description: 'Attribute ''source name''. Origin: FM Business Layer.EnergySource.SourceName'
    synonyms:
    - source name
  facts:
  - name: co2_factor_kg_kwh
    expr: CO2_FACTOR_KG_KWH
    data_type: NUMBER
    description: 'Measure ''co2 factor kg kwh''; default aggregation AVG (non-additive). Origin: FM Business Layer.EnergySource.CO2FactorKgKWh'
    synonyms:
    - co2 factor kg kwh
  metrics:
  - name: avg_co2_factor_kg_kwh
    expr: AVG(co2_factor_kg_kwh)
    description: AVG of co2 factor kg kwh (non-additive; default aggregation from FM)
    synonyms:
    - avg co2 factor kg kwh
    - co2 factor kg kwh
relationships:
- name: generation_to_dt
  left_table: generation
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: generation_to_power_plant
  left_table: generation
  right_table: power_plant
  relationship_columns:
  - left_column: POWER_PLANT_ID
    right_column: POWER_PLANT_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: generation_to_energy_source
  left_table: generation
  right_table: energy_source
  relationship_columns:
  - left_column: SOURCE_ID
    right_column: SOURCE_ID
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: portfolio_emissions_intensity
  question: What is the portfolio emissions intensity by month name, fiscal year, source category for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, energy_source.SOURCE_CATEGORY AS source_category, AVG(energy_source.CO2_FACTOR_KG_KWH) AS avg_co2_factor_kg_kwh, SUM(generation.GENERATED_MWH) AS total_generated_mwh, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg
    FROM __energy_source AS energy_source
    GROUP BY 1, 2, 3
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: wind_generation_performance
  question: What is the wind generation performance by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, power_plant.PLANT_NAME AS plant_name, power_plant.REGION AS region, SUM(generation.GENERATED_MWH) AS total_generated_mwh, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg, AVG(generation.FUEL_COST_PER_MWH) AS avg_fuel_cost_per_mwh
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __power_plant AS power_plant ON generation.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: capacity_factor_benchmarks
  question: What is the capacity factor benchmarks by month name, fiscal year, source name for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, energy_source.SOURCE_NAME AS source_name, energy_source.SOURCE_CATEGORY AS source_category, power_plant.REGION AS region, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct, MAX(power_plant.INSTALLED_CAPACITY_MW) AS max_installed_capacity_mw
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __energy_source AS energy_source ON generation.SOURCE_ID = energy_source.SOURCE_ID
    JOIN __power_plant AS power_plant ON generation.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: true
- name: coal_retirement_tracker
  question: What is the coal retirement tracker by full date, fiscal year, plant name for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.FISCAL_YEAR AS fiscal_year, power_plant.PLANT_NAME AS plant_name, power_plant.PLANT_TYPE AS plant_type, dt.QUARTER AS quarter, MAX(power_plant.INSTALLED_CAPACITY_MW) AS max_installed_capacity_mw, SUM(generation.GENERATED_MWH) AS total_generated_mwh, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg, AVG(generation.FUEL_COST_PER_MWH) AS avg_fuel_cost_per_mwh
    FROM __power_plant AS power_plant
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: co2_emissions_monthly
  question: What is the co2 emissions monthly by month name, fiscal year, source category for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, energy_source.SOURCE_CATEGORY AS source_category, power_plant.REGION AS region, AVG(energy_source.CO2_FACTOR_KG_KWH) AS avg_co2_factor_kg_kwh, SUM(generation.GENERATED_MWH) AS total_generated_mwh, SUM(generation.CO2_EMISSIONS_KG) AS total_co2_emissions_kg
    FROM __energy_source AS energy_source
    GROUP BY 1, 2, 3, 4
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: solar_output_report
  question: What is the solar output report by full date, month name, is weekend?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.IS_WEEKEND AS is_weekend, energy_source.SOURCE_NAME AS source_name, power_plant.PLANT_NAME AS plant_name, SUM(generation.GENERATED_MWH) AS total_generated_mwh, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct
    FROM __generation AS generation
    JOIN __dt AS dt ON generation.DATE_KEY = dt.DATE_KEY
    JOIN __energy_source AS energy_source ON generation.SOURCE_ID = energy_source.SOURCE_ID
    JOIN __power_plant AS power_plant ON generation.POWER_PLANT_ID = power_plant.POWER_PLANT_ID
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemanticLift (suggested)
  use_as_onboarding_question: false
- name: nuclear_capacity_factor
  question: What is the nuclear capacity factor by month name, fiscal year, plant name for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, power_plant.PLANT_NAME AS plant_name, MAX(power_plant.INSTALLED_CAPACITY_MW) AS max_installed_capacity_mw, SUM(generation.GENERATED_MWH) AS total_generated_mwh, AVG(generation.CAPACITY_FACTOR_PCT) AS avg_capacity_factor_pct, AVG(generation.FUEL_COST_PER_MWH) AS avg_fuel_cost_per_mwh, MAX(generation.CAPACITY_MW) AS max_capacity_mw
    FROM __power_plant AS power_plant
