name: SV_GRID_RELIABILITY
description: Outage events and reliability indices (generated by SemLift 1.0.0)
tables:
- name: outage_event
  description: 'Fact at OutageEvent grain. Source: ENERGY_OPS_DW.OUTAGE_EVENT. Origin: FM Business Layer.OutageEvent'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_OUTAGE_EVENT
  primary_key:
    columns:
    - OUTAGE_ID
  synonyms:
  - outage event
  - outage events
  dimensions:
  - name: outage_id
    expr: OUTAGE_ID
    data_type: NUMBER
    description: 'Identifier ''outage id''. Origin: FM Business Layer.OutageEvent.OutageID'
    synonyms:
    - outage id
  facts:
  - name: customers_affected
    expr: CUSTOMERS_AFFECTED
    data_type: NUMBER
    description: 'Measure ''customers affected''; default aggregation SUM (additive). Origin: FM Business Layer.OutageEvent.CustomersAffected'
    synonyms:
    - customers affected
  - name: duration_minutes
    expr: DURATION_MINUTES
    data_type: NUMBER
    description: 'Measure ''duration minutes''; default aggregation SUM (additive). Origin: FM Business Layer.OutageEvent.DurationMinutes'
    synonyms:
    - duration minutes
  - name: maifi_count
    expr: MAIFI_COUNT
    data_type: NUMBER
    description: 'Measure ''maifi count''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Operations_Package).
      TODO: map from ENERGY_OPS_DW (Energy_Operations_Package); not in FM model or ...'
    synonyms:
    - maifi count
  - name: saidi_minutes
    expr: SAIDI_MINUTES
    data_type: NUMBER
    description: 'Measure ''saidi minutes''; default aggregation SUM (additive). Origin: FM Business Layer.OutageEvent.SAIDIMinutes'
    synonyms:
    - saidi minutes
  - name: saifi_count
    expr: SAIFI_COUNT
    data_type: NUMBER
    description: 'Measure ''saifi count''; default aggregation SUM (additive). Origin: inferred from report usage (Energy_Operations_Package).
      TODO: map from ENERGY_OPS_DW (Energy_Operations_Package); not in FM model or ...'
    synonyms:
    - saifi count
  - name: outage_event_outage_id
    expr: OUTAGE_ID
    data_type: VARCHAR
    description: Grain key of FCT_OUTAGE_EVENT
  metrics:
  - name: total_customers_affected
    expr: SUM(customers_affected)
    description: SUM of customers affected (additive; default aggregation from FM)
    synonyms:
    - total customers affected
    - customers affected
  - name: total_duration_minutes
    expr: SUM(duration_minutes)
    description: SUM of duration minutes (additive; default aggregation from FM)
    synonyms:
    - total duration minutes
    - duration minutes
  - name: total_maifi_count
    expr: SUM(maifi_count)
    description: SUM of maifi count (additive; default aggregation from rule ADD-05:Count)
    synonyms:
    - total maifi count
    - maifi count
  - name: total_saidi_minutes
    expr: SUM(saidi_minutes)
    description: SUM of saidi minutes (additive; default aggregation from FM)
    synonyms:
    - total saidi minutes
    - saidi minutes
  - name: total_saifi_count
    expr: SUM(saifi_count)
    description: SUM of saifi count (additive; default aggregation from rule ADD-05:Count)
    synonyms:
    - total saifi count
    - saifi count
  - name: outage_event_count
    expr: COUNT(outage_event_outage_id)
    description: Number of outage event rows
    synonyms:
    - number of outage events
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: is_holiday
    expr: IS_HOLIDAY
    data_type: BOOLEAN
    description: 'Attribute ''is holiday''. Origin: FM Business Layer.Date.IsHoliday'
    synonyms:
    - is holiday
  - name: is_weekend
    expr: IS_WEEKEND
    data_type: BOOLEAN
    description: 'Attribute ''is weekend''. Origin: FM Business Layer.Date.IsWeekend'
    synonyms:
    - is weekend
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: month_number
    expr: MONTH_NUMBER
    data_type: NUMBER
    description: 'Attribute ''month number''. Origin: FM Business Layer.Date.MonthNumber'
    synonyms:
    - month number
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
  time_dimensions:
  - name: full_date
    expr: FULL_DATE
    data_type: DATE
    description: 'Attribute ''full date''. Origin: FM Business Layer.Date.FullDate'
    synonyms:
    - full date
    - reading date
    - bill date
    - gen date
    - event date
    - request date
- name: location
  description: 'Dimension at Location grain. Source: ENERGY_DW.LOCATION. Origin: FM Business Layer.Location (conformed across
    Energy_Billing_Package, Energy_Operations_Package)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_LOCATION
  primary_key:
    columns:
    - LOCATION_ID
  synonyms:
  - location
  dimensions:
  - name: climate_zone
    expr: CLIMATE_ZONE
    data_type: VARCHAR
    description: 'Attribute ''climate zone''. Origin: FM Business Layer.Location.ClimateZone'
    synonyms:
    - climate zone
  - name: region
    expr: REGION
    data_type: VARCHAR
    description: 'Attribute ''region''. Origin: FM Business Layer.Location.Region'
    synonyms:
    - region
- name: outage_cause
  description: Reference dimension OUTAGE_CAUSE derived from distinct OutageEvent.CauseCode values until a master table is
    mapped (rule DIM-03)
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_OUTAGE_CAUSE
  primary_key:
    columns:
    - CAUSE_CODE
  synonyms:
  - outage cause
  dimensions:
  - name: cause_code
    expr: CAUSE_CODE
    data_type: VARCHAR
    description: Reference key from OutageEvent.CauseCode
    synonyms:
    - cause code
  - name: cause_description
    expr: CAUSE_DESCRIPTION
    data_type: VARCHAR
    description: 'Attribute ''cause description''. Origin: inferred from report usage (Energy_Operations_Package). TODO: not
      in FM model or catalog'
    synonyms:
    - cause description
relationships:
- name: outage_event_to_outage_cause
  left_table: outage_event
  right_table: outage_cause
  relationship_columns:
  - left_column: CAUSE_CODE
    right_column: CAUSE_CODE
  join_type: left_outer
  relationship_type: many_to_one
- name: outage_event_to_dt
  left_table: outage_event
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: outage_event_to_location
  left_table: outage_event
  right_table: location
  relationship_columns:
  - left_column: LOCATION_ID
    right_column: LOCATION_ID
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: smart_grid_performance
  question: What is the smart grid performance by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, location.REGION AS region, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes, SUM(outage_event.SAIFI_COUNT) AS total_saifi_count
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: protection_system_status
  question: What is the protection system status by full date, cause code, outage id?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, outage_cause.CAUSE_CODE AS cause_code, outage_event.OUTAGE_ID AS outage_id, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
    GROUP BY 1, 2, 3
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: outage_duration_analysis
  question: What is the outage duration analysis by month name, quarter, region?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, location.REGION AS region, outage_cause.CAUSE_CODE AS cause_code, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes, SUM(outage_event.CUSTOMERS_AFFECTED) AS total_customers_affected, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
    GROUP BY 1, 2, 3, 4
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: power_quality_events
  question: What is the power quality events by full date, is weekend, is holiday?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.IS_WEEKEND AS is_weekend, dt.IS_HOLIDAY AS is_holiday, location.REGION AS region, outage_cause.CAUSE_CODE AS cause_code, dt.QUARTER AS quarter, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: grid_reliability_kp_is
  question: What is the grid reliability kpis by month name, quarter, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.MONTH_NAME AS month_name, dt.QUARTER AS quarter, dt.FISCAL_YEAR AS fiscal_year, location.REGION AS region, location.CLIMATE_ZONE AS climate_zone, outage_event.OUTAGE_ID AS outage_id, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes, SUM(outage_event.SAIFI_COUNT) AS total_saifi_count, SUM(outage_event.MAIFI_COUNT) AS total_maifi_count, SUM(outage_event.CUSTOMERS_AFFECTED) AS total_customers_affected, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: emergency_operations_dashboard
  question: What is the emergency operations dashboard by full date, region, cause code?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, location.REGION AS region, outage_cause.CAUSE_CODE AS cause_code, SUM(outage_event.CUSTOMERS_AFFECTED) AS total_customers_affected, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes, SUM(outage_event.SAIFI_COUNT) AS total_saifi_count
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
    GROUP BY 1, 2, 3
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: frequency_deviation_report
  question: What is the frequency deviation report by full date, is weekend, month number?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.IS_WEEKEND AS is_weekend, dt.MONTH_NUMBER AS month_number, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    GROUP BY 1, 2, 3
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: outage_event_log
  question: What is the outage event log by full date, region, cause code?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, location.REGION AS region, outage_cause.CAUSE_CODE AS cause_code, outage_cause.CAUSE_DESCRIPTION AS cause_description, dt.MONTH_NUMBER AS month_number, SUM(outage_event.CUSTOMERS_AFFECTED) AS total_customers_affected, SUM(outage_event.DURATION_MINUTES) AS total_duration_minutes, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes, SUM(outage_event.SAIFI_COUNT) AS total_saifi_count
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __location AS location ON outage_event.LOCATION_ID = location.LOCATION_ID
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
    GROUP BY 1, 2, 3, 4, 5
  verified_by: SemLift (suggested)
  use_as_onboarding_question: false
- name: switching_orders_log
  question: What is the switching orders log by full date, is weekend, cause code?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.IS_WEEKEND AS is_weekend, outage_cause.CAUSE_CODE AS cause_code, dt.QUARTER AS quarter, SUM(outage_event.SAIDI_MINUTES) AS total_saidi_minutes, SUM(outage_event.SAIFI_COUNT) AS total_saifi_count
    FROM __outage_event AS outage_event
    JOIN __dt AS dt ON outage_event.DATE_KEY = dt.DATE_KEY
    JOIN __outage_cause AS outage_cause ON outage_event.CAUSE_CODE = outage_cause.CAUSE_CODE
