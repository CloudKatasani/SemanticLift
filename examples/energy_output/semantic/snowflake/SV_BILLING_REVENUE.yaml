name: SV_BILLING_REVENUE
description: Billed revenue (generated by SemLift 1.0.0)
tables:
- name: billing
  description: 'Fact at Billing grain. Source: CC_AND_B_PROD.BILLING. Origin: FM Business Layer.Billing'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: FCT_BILLING
  primary_key:
    columns:
    - BILL_ID
  synonyms:
  - billing
  - billings
  dimensions:
  - name: is_ebill
    expr: IS_EBILL
    data_type: BOOLEAN
    description: 'Attribute ''is e bill''. Origin: FM Business Layer.Billing.IsEBill'
    synonyms:
    - is e bill
  - name: is_overdue
    expr: IS_OVERDUE
    data_type: VARCHAR
    description: 'Attribute ''is overdue''. Origin: FM Business Layer.Billing.IsOverdue'
    synonyms:
    - is overdue
  - name: payment_status
    expr: PAYMENT_STATUS
    data_type: VARCHAR
    description: 'Attribute ''payment status''. Origin: FM Business Layer.Billing.PaymentStatus'
    synonyms:
    - payment status
    sample_values:
    - Paid
    - Unpaid
    - Overdue
    - Disputed
  time_dimensions:
  - name: due_date
    expr: DUE_DATE
    data_type: DATE
    description: 'Attribute ''due date''. Origin: inferred from report usage (Energy_Billing_Package)'
    synonyms:
    - due date
  facts:
  - name: bill_amount
    expr: BILL_AMOUNT
    data_type: NUMBER
    description: 'Measure ''bill amount''; default aggregation SUM (additive). Origin: FM Business Layer.Billing.BillAmount'
    synonyms:
    - bill amount
  - name: demand_charge
    expr: DEMAND_CHARGE
    data_type: NUMBER
    description: 'Measure ''demand charge''; default aggregation SUM (additive). Origin: FM Business Layer.Billing.DemandCharge'
    synonyms:
    - demand charge
  - name: energy_charge
    expr: ENERGY_CHARGE
    data_type: NUMBER
    description: 'Measure ''energy charge''; default aggregation SUM (additive). Origin: FM Business Layer.Billing.EnergyCharge'
    synonyms:
    - energy charge
  - name: tax_amount
    expr: TAX_AMOUNT
    data_type: NUMBER
    description: 'Measure ''tax amount''; default aggregation SUM (additive). Origin: FM Business Layer.Billing.TaxAmount'
    synonyms:
    - tax amount
  - name: total_bill_with_tax
    expr: TOTAL_BILL_WITH_TAX
    data_type: NUMBER
    description: 'Measure ''total bill with tax''; default aggregation SUM (additive). Origin: FM Business Layer.Billing.TotalBillWithTax'
    synonyms:
    - total bill with tax
  - name: bill_id
    expr: BILL_ID
    data_type: VARCHAR
    description: Grain key of FCT_BILLING
  metrics:
  - name: total_bill_amount
    expr: SUM(bill_amount)
    description: SUM of bill amount (additive; default aggregation from FM)
    synonyms:
    - total bill amount
    - bill amount
  - name: total_demand_charge
    expr: SUM(demand_charge)
    description: SUM of demand charge (additive; default aggregation from FM)
    synonyms:
    - total demand charge
    - demand charge
  - name: total_energy_charge
    expr: SUM(energy_charge)
    description: SUM of energy charge (additive; default aggregation from FM)
    synonyms:
    - total energy charge
    - energy charge
  - name: total_tax_amount
    expr: SUM(tax_amount)
    description: SUM of tax amount (additive; default aggregation from FM)
    synonyms:
    - total tax amount
    - tax amount
  - name: total_bill_with_tax_sum
    expr: SUM(total_bill_with_tax)
    description: SUM of total bill with tax (additive; default aggregation from FM)
    synonyms:
    - total bill with tax sum
    - total bill with tax
  - name: billing_count
    expr: COUNT(bill_id)
    description: Number of billing rows
    synonyms:
    - number of billings
- name: dt
  description: 'Dimension at Date grain. Source: ENERGY_DW.DATE_DIM. Origin: FM Business Layer.Date (conformed across Energy_Billing_Package,
    Energy_Compliance_Package, Energy_CustomerService_Package, Energy_Finance_Package, Energy_Generation_Package, ...'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_DATE
  primary_key:
    columns:
    - DATE_KEY
  synonyms:
  - date
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: 'Attribute ''fiscal year''. Origin: FM Business Layer.Date.FiscalYear'
    synonyms:
    - fiscal year
    - FY
    sample_values:
    - '2022'
    - '2023'
    - '2024'
    - '2025'
    - '2026'
    - '2027'
  - name: month_name
    expr: MONTH_NAME
    data_type: VARCHAR
    description: 'Attribute ''month name''. Origin: FM Business Layer.Date.MonthName'
    synonyms:
    - month name
    - period
    sample_values:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
  - name: quarter
    expr: QUARTER
    data_type: VARCHAR
    description: 'Attribute ''quarter''. Origin: FM Business Layer.Date.Quarter'
    synonyms:
    - quarter
  time_dimensions:
  - name: full_date
    expr: FULL_DATE
    data_type: DATE
    description: 'Attribute ''full date''. Origin: FM Business Layer.Date.FullDate'
    synonyms:
    - full date
    - reading date
    - bill date
    - gen date
    - event date
    - request date
- name: meter
