  dimensions:
  - name: customer_id
    expr: CUSTOMER_ID
    data_type: VARCHAR
    description: 'Identifier ''customer id''. Origin: FM Business Layer.Customer.CustomerID'
    synonyms:
    - customer id
  - name: account_type
    expr: ACCOUNT_TYPE
    data_type: VARCHAR
    description: 'Attribute ''account type''. Origin: FM Business Layer.Customer.AccountType'
    synonyms:
    - account type
  - name: customer_name
    expr: CUSTOMER_NAME
    data_type: VARCHAR
    description: 'Attribute ''customer name''. Origin: FM Business Layer.Customer.CustomerName'
    synonyms:
    - customer name
  - name: customer_segment
    expr: CUSTOMER_SEGMENT
    data_type: VARCHAR
    description: 'Attribute ''customer segment''. Origin: FM Business Layer.Customer.CustomerSegment'
    synonyms:
    - customer segment
  - name: service_tier
    expr: SERVICE_TIER
    data_type: VARCHAR
    description: 'Attribute ''service tier''. Origin: inferred from report usage (Energy_Billing_Package). TODO: map from
      CC_AND_B_PROD (Energy_Billing_Package); not in FM model or catalog'
    synonyms:
    - service tier
- name: location
  description: 'Dimension at Location grain. Source: ENERGY_DW.LOCATION. Origin: FM Business Layer.Location (conformed across
    Energy_Billing_Package, Energy_Operations_Package)'
  base_table:
    database: ENERGY_SEMANTIC
    schema: CORE
    table: DIM_LOCATION
  primary_key:
    columns:
    - LOCATION_ID
  synonyms:
  - location
  dimensions:
  - name: city
    expr: CITY
    data_type: VARCHAR
    description: 'Attribute ''city''. Origin: FM Business Layer.Location.City'
    synonyms:
    - city
  - name: region
    expr: REGION
    data_type: VARCHAR
    description: 'Attribute ''region''. Origin: FM Business Layer.Location.Region'
    synonyms:
    - region
relationships:
- name: billing_to_dt
  left_table: billing
  right_table: dt
  relationship_columns:
  - left_column: DATE_KEY
    right_column: DATE_KEY
  join_type: left_outer
  relationship_type: many_to_one
- name: billing_to_meter
  left_table: billing
  right_table: meter
  relationship_columns:
  - left_column: METER_ID
    right_column: METER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_to_customer
  left_table: meter
  right_table: customer
  relationship_columns:
  - left_column: CUSTOMER_ID
    right_column: CUSTOMER_ID
  join_type: left_outer
  relationship_type: many_to_one
- name: meter_to_location
  left_table: meter
  right_table: location
  relationship_columns:
  - left_column: LOCATION_ID
    right_column: LOCATION_ID
  join_type: left_outer
  relationship_type: many_to_one
verified_queries:
- name: customer_billing_summary
  question: What is the customer billing summary by full date, month name, fiscal year for fiscal year 2026?
  sql: |-
    SELECT dt.FULL_DATE AS full_date, dt.MONTH_NAME AS month_name, dt.FISCAL_YEAR AS fiscal_year, customer.CUSTOMER_NAME AS customer_name, customer.CUSTOMER_SEGMENT AS customer_segment, location.REGION AS region, SUM(billing.BILL_AMOUNT) AS total_bill_amount, SUM(billing.TAX_AMOUNT) AS total_tax_amount, SUM(billing.DEMAND_CHARGE) AS total_demand_charge
    FROM __billing AS billing
    JOIN __dt AS dt ON billing.DATE_KEY = dt.DATE_KEY
    JOIN __meter AS meter ON billing.METER_ID = meter.METER_ID
    JOIN __customer AS customer ON meter.CUSTOMER_ID = customer.CUSTOMER_ID
    JOIN __location AS location ON meter.LOCATION_ID = location.LOCATION_ID
    WHERE dt.FISCAL_YEAR = 2026
    GROUP BY 1, 2, 3, 4, 5, 6
  verified_by: SemLift (suggested)
  use_as_onboarding_question: true
- name: budget_billing_status
