apiVersion: v3.0.0
kind: DataContract
id: urn:datacontract:customer-experience
version: 1.0.0
status: proposed
product: customer-experience
name: Customer Experience
domain: cx
owner: Energy Data Engineering Team
steward: analytics-team@energy-utility.com
classification: Internal - Restricted
retention: 7 years (FERC)
source_systems:
- SF_SERVICE_CLOUD
data_modules:
- Customer_Experience_DM
- EV_Analytics_DM
outputs:
- SEM.SV_CUSTOMER_SERVICE
- SEM.SV_EV_CHARGING
- DP_CX.OUT_COMPLAINT_MONTHLY
- DP_CX.OUT_EV_CHARGING_DAILY
- DP_CX.OUT_FIELD_SERVICE_DAILY
- DP_CX.OUT_FIELD_SERVICE_MONTHLY
- DP_CX.OUT_SERVICE_REQUEST_DAILY
- DP_CX.OUT_SERVICE_REQUEST_MONTHLY
grain:
  FCT_COMPLAINT:
  - COMPLAINT_ID
  - CUSTOMER_ID
  - DATE_KEY
  FCT_EV_CHARGING:
  - EV_CHARGING_ID
  - CHARGER_ID
  - CUSTOMER_ID
  - DATE_KEY
  FCT_FIELD_SERVICE:
  - FIELD_SERVICE_ID
  - TECHNICIAN_ID
  - CUSTOMER_ID
  - DATE_KEY
  FCT_SERVICE_REQUEST:
  - SERVICE_REQUEST_ID
  - AGENT_ID
  - CUSTOMER_ID
  - DATE_KEY
freshness_sla: 24h
slaProperties:
- property: latency
  value: 24h
default_filters:
- dimension: fiscal_year
  value: '2026'
  cognos_prompt: p_FiscalYear
quality:
- not_null:
  - DIM_AGENT.AGENT_ID
- unique:
  - DIM_AGENT.AGENT_ID
- not_null:
  - DIM_CHARGER.CHARGER_ID
- unique:
  - DIM_CHARGER.CHARGER_ID
- not_null:
  - DIM_TECHNICIAN.TECHNICIAN_ID
- unique:
  - DIM_TECHNICIAN.TECHNICIAN_ID
- not_null:
  - FCT_COMPLAINT.COMPLAINT_ID
- unique:
  - FCT_COMPLAINT.COMPLAINT_ID
- referential: FCT_COMPLAINT.CUSTOMER_ID -> DIM_CUSTOMER.CUSTOMER_ID
- referential: FCT_COMPLAINT.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_EV_CHARGING.EV_CHARGING_ID
- unique:
  - FCT_EV_CHARGING.EV_CHARGING_ID
- referential: FCT_EV_CHARGING.CHARGER_ID -> DIM_CHARGER.CHARGER_ID
- referential: FCT_EV_CHARGING.CUSTOMER_ID -> DIM_CUSTOMER.CUSTOMER_ID
- referential: FCT_EV_CHARGING.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_FIELD_SERVICE.FIELD_SERVICE_ID
- unique:
  - FCT_FIELD_SERVICE.FIELD_SERVICE_ID
- referential: FCT_FIELD_SERVICE.TECHNICIAN_ID -> DIM_TECHNICIAN.TECHNICIAN_ID
- referential: FCT_FIELD_SERVICE.CUSTOMER_ID -> DIM_CUSTOMER.CUSTOMER_ID
- referential: FCT_FIELD_SERVICE.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_SERVICE_REQUEST.SERVICE_REQUEST_ID
- unique:
  - FCT_SERVICE_REQUEST.SERVICE_REQUEST_ID
- referential: FCT_SERVICE_REQUEST.AGENT_ID -> DIM_AGENT.AGENT_ID
- referential: FCT_SERVICE_REQUEST.CUSTOMER_ID -> DIM_CUSTOMER.CUSTOMER_ID
- referential: FCT_SERVICE_REQUEST.DATE_KEY -> DIM_DATE.DATE_KEY
- freshness:
    max_lag: 24h
