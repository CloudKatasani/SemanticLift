- referential: FCT_DATA_SUBMISSION.REPORTING_ENTITY -> DIM_REPORTING_ENTITY.REPORTING_ENTITY
- referential: FCT_DATA_SUBMISSION.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
