  FCT_AUDIT_RECORD:
  - AUDIT_RECORD_ID
  - DATE_KEY
  FCT_COMPLIANCE_EVENT:
  - COMPLIANCE_EVENT_ID
  - STANDARD_REF
  - DATE_KEY
  FCT_DATA_SUBMISSION:
  - DATA_SUBMISSION_ID
  - REPORTING_ENTITY
  - DATE_KEY
  FCT_MISOPERATION:
  - MISOP_ID
  - DATE_KEY
  FCT_PRC004_TEST:
  - PRC004_REQUIREMENT_ID
  - ASSET_ID
  - DATE_KEY
  FCT_VIOLATION:
  - VIOLATION_ID
  - STANDARD_ID
  - DATE_KEY
freshness_sla: 24h
slaProperties:
- property: latency
  value: 24h
