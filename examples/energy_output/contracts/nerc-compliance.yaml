- referential: FCT_PRC004_TEST.ASSET_ID -> DIM_ASSET.ASSET_ID
- referential: FCT_PRC004_TEST.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_VIOLATION.VIOLATION_ID
- unique:
