- not_null:
  - DIM_REPORTING_ENTITY.REPORTING_ENTITY
- unique:
  - DIM_REPORTING_ENTITY.REPORTING_ENTITY
- not_null:
  - FCT_AUDIT_RECORD.AUDIT_RECORD_ID
- unique:
  - FCT_AUDIT_RECORD.AUDIT_RECORD_ID
- referential: FCT_AUDIT_RECORD.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_COMPLIANCE_EVENT.COMPLIANCE_EVENT_ID
- unique:
  - FCT_COMPLIANCE_EVENT.COMPLIANCE_EVENT_ID
- referential: FCT_COMPLIANCE_EVENT.STANDARD_REF -> DIM_NERC_STANDARD.STANDARD_REF
- referential: FCT_COMPLIANCE_EVENT.DATE_KEY -> DIM_DATE.DATE_KEY
- not_null:
  - FCT_DATA_SUBMISSION.DATA_SUBMISSION_ID
- unique:
