apiVersion: v3.0.0
kind: DataContract
id: urn:datacontract:nerc-compliance
version: 1.0.0
status: proposed
product: nerc-compliance
name: NERC Compliance
domain: nerc
owner: Energy Data Engineering Team
steward: analytics-team@energy-utility.com
classification: Internal - Restricted
retention: 7 years (FERC)
source_systems:
- NERC_COMPLIANCE_DB
data_modules:
- NERC_Compliance_DM
