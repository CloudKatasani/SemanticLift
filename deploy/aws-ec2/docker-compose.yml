# SemanticLift on a single EC2 instance. See docs/DEPLOY_AWS_EC2.md.
#
#   docker compose up -d --build                  # app only (personal tokens, or the shared token)
#   docker compose --profile sso up -d --build    # app + oauth2-proxy for single sign-on
#
# The app listens on 127.0.0.1 only; nginx on the host terminates TLS and is the only public entry point.
services:
  semanticlift:
    build:
      context: ../..
    image: semanticlift:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: semanticlift.env
    volumes:
      - /data/semanticlift:/data                     # all state: projects under /data/home, users.yaml
      - /data/semanticlift/config:/app/config:ro     # estate configurations offered in the UI
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  oauth2-proxy:
    profiles: ["sso"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0  # pin the current release you have approved
    restart: unless-stopped
    depends_on: [semanticlift]
    ports:
      - "127.0.0.1:4180:4180"
    env_file: oauth2-proxy.env
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://semanticlift:8000
      - --reverse-proxy=true
      - --pass-user-headers=true                     # sets X-Forwarded-User / -Email / -Groups for SemanticLift
      - --skip-provider-button=true
