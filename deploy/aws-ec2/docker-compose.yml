# SemanticLift on a single EC2 instance, behind Caddy (automatic HTTPS). See docs/DEPLOY_AWS_EC2.md.
#
#   docker compose up -d --build                  # Caddy + app
#   docker compose --profile sso up -d --build    # Caddy + oauth2-proxy (single sign-on) + app
#
# Only Caddy is published to the internet (80 and 443). The app port is bound to 127.0.0.1 for local health checks.
services:
  caddy:
    image: caddy:2.8                                 # pin the current 2.x release you have approved
    restart: unless-stopped
    depends_on: [semanticlift]
    ports:
      - "80:80"                                      # HTTP -> HTTPS redirect and Let's Encrypt challenges
      - "443:443"
      - "443:443/udp"                                # HTTP/3
    env_file: caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data                       # certificates and keys (kept across rebuilds)
      - /data/caddy/config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  semanticlift:
    build:
      context: ../..
    image: semanticlift:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: semanticlift.env
    volumes:
      - /data/semanticlift:/data                     # all state: projects under /data/home, users.yaml
      - /data/semanticlift/config:/app/config:ro     # estate configurations offered in the UI
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  oauth2-proxy:
    profiles: ["sso"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0  # pin the current release you have approved
    restart: unless-stopped
    depends_on: [semanticlift]
    env_file: oauth2-proxy.env
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://semanticlift:8000
      - --reverse-proxy=true
      - --pass-user-headers=true                     # sets X-Forwarded-User / -Email / -Groups for SemanticLift
      - --skip-provider-button=true
