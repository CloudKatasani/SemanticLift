# /etc/nginx/sites-available/semanticlift  (then: ln -s ../sites-available/semanticlift /etc/nginx/sites-enabled/)
# Plain HTTP to start with; `certbot --nginx -d <host>` adds the TLS listener and the HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name semanticlift.example.com;

    client_max_body_size 500m;        # Cognos export bundles
    proxy_read_timeout 600s;          # synchronous runs from the CLI; the UI uses background jobs
    proxy_send_timeout 600s;

    location / {
        # app only:            http://127.0.0.1:8000
        # single sign-on mode: http://127.0.0.1:4180  (oauth2-proxy in front of the app)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # never let a browser supply identity headers itself
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Forwarded-Preferred-Username "";
    }
}
