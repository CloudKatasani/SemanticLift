[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semlift"
version = "1.0.0"
description = "SemLift - Cognos-to-Data-Platform Semantic Layer Migrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "networkx>=3",
  "sqlglot>=25",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
semlift = "semlift.cli:main"

[tool.setuptools.packages.find]
include = ["semlift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
