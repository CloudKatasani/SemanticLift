# SemanticLift estate configuration for the synthetic telecommunications Cognos export
# (samples/Cognos Telco Input.zip, generated by samples/telco/generate_telco_bundle.py).
# Merged on top of semlift/config.py DEFAULTS. Only names, boundaries and vocabulary are estate-specific.

as_of_date: 2026-10-20          # export date of all_reports.xml

rationalization:
  lookback_days: 180
  min_runs_per_day: 0
  dormant_before: 2026-01-01

target:
  database: TELCO_SEMANTIC
  raw_schema_overrides:
    TELCO_DW: RAW_TELCO_DW
    NETWORK_PERF_DW: RAW_NETWORK
    AMDOCS_BILLING_PROD: RAW_BILLING
    SF_TELCO_CRM: RAW_CRM
    SAP_SD_PROD: RAW_SAP_SD
    SAP_FI_PROD: RAW_SAP_FI
    REG_COMPLIANCE_DB: RAW_REGULATORY

aggregates:
  low_volume_domains: [Telco_Regulatory_Package]

governance:
  four_eyes: true

naming:
  package_affixes: ['^Telco_', '_Package$']
  product_names:
    Telco_Network_Package: Network Performance
    Telco_Billing_Package: Billing and Revenue
    Telco_Customer_Package: Customer Experience and Churn
    Telco_Sales_Package: Sales and Retail
    Telco_Finance_Package: Financial Performance
    Telco_Regulatory_Package: Regulatory Compliance
    ENTERPRISE: Enterprise Reference
  domain_codes:
    Telco_Network_Package: NETWORK
    Telco_Billing_Package: BILLING
    Telco_Customer_Package: CX
    Telco_Sales_Package: SALES
    Telco_Finance_Package: FINANCE
    Telco_Regulatory_Package: REGULATORY
    ENTERPRISE: REFERENCE
  fact_names:
    NetworkKPI: NETWORK_KPI
    UsageRecord: USAGE
    CapexProject: CAPEX_SPEND
  policy_names:
    MSISDN_Mask: MP_MSISDN
    CreditScore_Mask: MP_CREDIT_SCORE
  mapping_table_names:
    MarketFilter: MAP_USER_MARKET
    CostCenterFilter: MAP_USER_COST_CENTER
  subject_areas:
    SV_NETWORK_PERFORMANCE: {domain: Telco_Network_Package, facts: [NetworkKPI], description: Call drops, throughput, availability and utilisation by cell}
    SV_NETWORK_INCIDENTS:   {domain: Telco_Network_Package, facts: [TroubleTicket, NetworkOutage], description: Trouble tickets and network outages}
    SV_BILLING_REVENUE:     {domain: Telco_Billing_Package, facts: [Invoice], description: Invoiced revenue, taxes, discounts and payment status}
    SV_USAGE:               {domain: Telco_Billing_Package, facts: [UsageRecord], description: Voice, data and SMS usage and usage revenue}
    SV_CUSTOMER_CHURN:      {domain: Telco_Customer_Package, facts: [ChurnEvent, NPSSurvey], description: Churn, churn reasons and NPS}
    SV_CUSTOMER_CARE:       {domain: Telco_Customer_Package, facts: [CareInteraction], description: Care contacts, handle time and first-contact resolution}
    SV_SALES:               {domain: Telco_Sales_Package, facts: [SalesOrder, Promotion], description: Orders, gross adds, devices and promotions}
    SV_FINANCE_PERFORMANCE: {domain: Telco_Finance_Package, facts: [BudgetActual, CapexProject], description: Budget vs actual and network capex}
    SV_REGULATORY:          {domain: Telco_Regulatory_Package, facts: [ComplianceCase, E911Call, CPNIRequest], description: Compliance cases, E911 performance and CPNI requests}

security:
  precedence: security_files
  rls_default_deny: true

owners:
  report_owner: Package report owners

# Business KPIs defined differently across packages (page "Common KPIs")
kpi_concepts:
  Revenue: [Invoice.InvoiceAmount, UsageRecord.UsageRevenue, SalesOrder.OrderValue]
  Data volume: [UsageRecord.DataGB, UsageRecord.DataMB, NetworkKPI.TrafficGB]
  Service outage impact: [NetworkOutage.SubscribersAffected, NetworkOutage.OutageMinutes]

# Industry vocabulary for generated descriptions and synonyms
llm:
  domain: telecommunications
glossary:
  msisdn: mobile number
  arpu: average revenue per user
  cpni: customer proprietary network information
  nps: net promoter score
  fcr: first contact resolution
  usf: universal service fund
  gb: gigabytes
  mb: megabytes
  mbps: megabits per second
  sms: text messages
  e911: enhanced 911
  kpi: key performance indicator
